<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="一个在浏览器本地运行的个人生活管理工作台。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23171b24'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='white' font-family='sans-serif'%3E%E7%94%9F%3C/text%3E%3C/svg%3E">
  <title>人生管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-soft: #fbfbfd;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --muted-2: #8e8e93;
      --border: #e5e5ea;
      --primary: #0071e3;
      --primary-soft: #eaf4ff;
      --green: #34c759;
      --orange: #ff9500;
      --pink: #ff375f;
      --purple: #af52de;
      --cyan: #5ac8fa;
      --indigo: #5856d6;
      --danger: #ff3b30;
      --radius-card: 16px;
      --radius-control: 12px;
      --shadow: 0 10px 32px rgba(28, 39, 49, .07);
      --shadow-float: 0 18px 50px rgba(28, 39, 49, .16);
      --sidebar: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
    body.modal-open, body.confirm-open, body.drawer-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; }
    button, label, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, .22);
    }
    button:active { transform: scale(.98); }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; left: 14px; top: 10px; z-index: 100; padding: 10px 14px; border-radius: 10px; background: #171b24; color: #fff; transform: translateY(-160%); transition: transform .18s ease; }
    .skip-link:focus { transform: none; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
      width: var(--sidebar);
      padding: 22px 14px 16px;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, .92);
      border-right: 1px solid rgba(0, 0, 0, .06);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
    }

    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 18px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--primary); color: #fff; font-size: 18px; font-weight: 750;
      box-shadow: 0 8px 18px rgba(0, 113, 227, .22);
    }
    .brand strong { display: block; font-size: 16px; letter-spacing: -.3px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .nav { display: grid; gap: 4px; }
    .nav-btn, .utility-btn {
      width: 100%; min-height: 44px; border-radius: 11px;
      display: flex; align-items: center; gap: 11px;
      padding: 0 12px; background: transparent; color: #424245;
      cursor: pointer; text-align: left; font-size: 14px;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .nav-btn:hover, .utility-btn:hover { background: #f2f2f7; }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
    .nav-icon {
      width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px;
      display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 750;
      background: var(--icon, var(--primary));
    }
    .sidebar-spacer { flex: 1; min-height: 18px; }
    .sidebar-tools { padding-top: 12px; border-top: 1px solid var(--border); display: grid; gap: 2px; }
    .utility-btn { color: var(--muted); font-size: 13px; }
    .utility-symbol { width: 22px; color: var(--text); font-size: 17px; text-align: center; }

    .main { min-height: 100dvh; margin-left: var(--sidebar); }
    .mobile-topbar { display: none; }
    .content { width: min(100%, 1280px); margin: 0 auto; padding: 30px 32px 80px; }
    .page { animation: page-in .28s cubic-bezier(.2, .75, .25, 1) both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
    .page-title { margin: 0; font-size: clamp(25px, 3vw, 32px); line-height: 1.15; letter-spacing: -.8px; }
    .page-subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .card {
      background: var(--surface); border: 1px solid rgba(0, 0, 0, .045);
      border-radius: var(--radius-card); box-shadow: var(--shadow);
    }
    .card-pad { padding: 20px; }
    .section-title { margin: 0; font-size: 17px; letter-spacing: -.25px; }
    .section-note { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .section-head > :first-child { min-width: 0; }
    .section-head > div:first-child { flex: 1; }
    .stack { display: grid; gap: 16px; }
    .grid-main-side { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(285px, .72fr); gap: 20px; }
    .grid-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .grid-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

    .btn {
      min-height: 44px; border-radius: var(--radius-control); padding: 0 16px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: var(--primary); color: #fff; cursor: pointer; font-weight: 650; font-size: 14px;
      white-space: nowrap; transition: filter .18s ease, transform .18s ease, background .18s ease;
    }
    .btn:hover { filter: brightness(.96); }
    .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost { min-height: 36px; padding: 0 10px; background: transparent; color: var(--muted); }
    .btn.danger { background: #fff0f0; color: #c9342e; }
    .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .field { display: grid; gap: 7px; min-width: 0; }
    .field label, .field-label { color: #424245; font-size: 13px; font-weight: 600; }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 0 12px;
      border: 1px solid #d2d2d7; border-radius: var(--radius-control);
      background: #fff; color: var(--text); transition: border-color .18s ease, box-shadow .18s ease;
    }
    .textarea { min-height: 88px; padding-block: 11px; resize: vertical; line-height: 1.5; }
    .input::placeholder, .textarea::placeholder { color: #86868b; opacity: 1; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); outline: 0; }
    .form-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-8 { grid-column: span 8; }
    .span-12 { grid-column: 1 / -1; }
    .field-error { min-height: 16px; color: #c9342e; font-size: 12px; }
    .form-message { margin: -4px 0 14px; padding: 10px 12px; border-radius: 11px; background: #fff0f0; color: #a92822; font-size: 13px; line-height: 1.45; }
    .form-advanced { grid-column: 1 / -1; border-top: 1px solid var(--border); }
    .form-advanced summary { min-height: 42px; display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 620; list-style: none; }
    .form-advanced summary::-webkit-details-marker { display: none; }
    .form-advanced summary::before { content: "+"; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-soft); color: var(--text); }
    .form-advanced[open] summary::before { content: "−"; }
    .form-advanced-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; padding: 2px 0 12px; align-items: end; }
    .preset-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .preset-btn { min-height: 38px; padding: 0 12px; border-radius: 10px; background: var(--surface-soft); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 620; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .preset-btn:hover { background: var(--module-soft, var(--primary-soft)); color: var(--module-action, var(--primary)); }

    .summary-strip {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
      padding: 18px 8px; margin-bottom: 20px;
    }
    .metric { min-width: 0; padding: 2px 18px; }
    .metric + .metric { border-left: 1px solid var(--border); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 7px; font-size: clamp(23px, 3vw, 30px); font-weight: 720; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
    .metric-note { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .money-income { color: #248a3d; } .money-expense { color: var(--pink); }

    .quick-form { padding: 16px; margin-bottom: 14px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 14px; }
    .segmented { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: #ececf0; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label { min-width: 54px; min-height: 36px; padding: 0 12px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 13px; }
    .segmented input:checked + label { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); font-weight: 650; }
    .segmented input:focus-visible + label, .choice input:focus-visible + label, .mood-option input:focus-visible + label, .todo-sheet-priorities input:focus-visible + label { outline: 2px solid var(--primary); outline-offset: 2px; }
    .segmented button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); font-weight: 650; }

    .list { display: grid; }
    .list-row { min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
    .list-row:last-child { border-bottom: 0; }
    .row-main { min-width: 0; flex: 1; }
    .row-title { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
    .row-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .row-actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      background: transparent; color: var(--muted); cursor: pointer; font-size: 17px;
    }
    .icon-btn:hover { background: #f2f2f7; color: var(--text); }
    .check {
      appearance: none; width: 22px; height: 22px; flex: 0 0 22px;
      border: 2px solid #c7c7cc; border-radius: 7px; background: #fff; cursor: pointer;
      display: grid; place-content: center;
    }
    .check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 800; transform: scale(0); transition: transform .14s ease; }
    .check:checked { background: var(--primary); border-color: var(--primary); }
    .check:checked::after { transform: scale(1); }
    .completed .row-title { color: var(--muted-2); text-decoration: line-through; }

    .badge {
      display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px;
      flex: 0 0 auto; border-radius: 999px; font-size: 11px; font-weight: 650;
      font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
    }
    .badge-high { color: #c9342e; background: #fff0f0; }
    .badge-medium { color: #a55c00; background: #fff5e6; }
    .badge-low { color: #26783a; background: #ebf9ee; }

    .progress-ring { width: 148px; height: 148px; margin: 8px auto 16px; position: relative; display: grid; place-items: center; }
    .progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: #ececf0; stroke-width: 10; }
    .ring-value { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
    .ring-copy { position: absolute; text-align: center; }
    .ring-copy strong { display: block; font-size: 30px; letter-spacing: -1px; }
    .ring-copy small { color: var(--muted); font-size: 12px; }
    .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini-stat { padding: 11px 8px; border-radius: 12px; background: var(--surface-soft); text-align: center; }
    .mini-stat strong { display: block; font-size: 18px; }
    .mini-stat span { color: var(--muted); font-size: 11px; }

    .empty { padding: 42px 16px; text-align: center; color: var(--muted); }
    .empty-symbol { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 15px; display: grid; place-items: center; background: #f2f2f7; color: var(--primary); font-size: 22px; font-weight: 700; }
    .empty strong { display: block; color: var(--text); font-size: 14px; }
    .empty p { margin: 6px auto 0; max-width: 320px; font-size: 13px; line-height: 1.5; }

    .chart-wrap { position: relative; width: 100%; height: 250px; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }
    .chart-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; background: linear-gradient(180deg, transparent, rgba(245,245,247,.4)); border-radius: 12px; }
    .legend { display: grid; gap: 8px; margin-top: 12px; }
    .legend-row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

    .choice-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .choice input { position: absolute; opacity: 0; }
    .choice label { min-height: 52px; padding: 6px; border: 1px solid var(--border); border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: #424245; font-size: 13px; text-align: center; }
    .choice input:checked + label { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); font-weight: 650; }

    .heat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .heat-day { min-width: 0; padding: 10px 4px; border-radius: 12px; text-align: center; background: #f2f2f7; }
    .heat-day span { display: block; font-size: 11px; color: var(--muted); }
    .heat-day strong { display: block; margin: 5px 0; font-size: 15px; }
    .heat-day small { display: block; color: var(--muted); font-size: 10px; }
    .heat-1 { background: #fff2df; } .heat-2 { background: #ffdca9; } .heat-3 { background: #ffbd63; color: #633400; }
    .streak { display: flex; align-items: flex-end; gap: 8px; }
    .streak strong { font-size: 48px; line-height: .9; letter-spacing: -2px; color: var(--orange); }
    .streak span { padding-bottom: 3px; color: var(--muted); font-size: 14px; }

    .mood-picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .mood-option input { position: absolute; opacity: 0; }
    .mood-option label { min-height: 58px; border: 1px solid transparent; border-radius: 14px; display: grid; place-items: center; cursor: pointer; font-size: 28px; background: #f6f6f8; }
    .mood-option input:checked + label { border-color: var(--primary); background: #fff1f4; box-shadow: 0 0 0 2px rgba(0,113,227,.1); }

    .book-card { padding: 20px; }
    .book-title { margin: 0; font-size: 18px; letter-spacing: -.25px; }
    .book-author { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .book-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .progress { height: 7px; margin: 17px 0 9px; overflow: hidden; border-radius: 999px; background: #ececf0; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--purple); transition: width .35s ease; }
    .progress-copy { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .inline-form { display: flex; gap: 8px; margin-top: 14px; }
    .inline-form .input { min-width: 0; }
    details.notes { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    details.notes summary { cursor: pointer; color: var(--purple); font-size: 13px; font-weight: 650; }
    .note-item { padding: 10px 0; border-bottom: 1px solid var(--border); color: #424245; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }

    .trip-header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .trip-destination { margin: 0; font-size: 23px; letter-spacing: -.5px; }
    .trip-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; }
    .trip-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; }
    .trip-tab { min-height: 44px; padding: 0 13px; border-radius: 999px; background: #fff; border: 1px solid var(--border); color: var(--muted); cursor: pointer; white-space: nowrap; }
    .trip-tab.active { color: var(--primary); border-color: #acd4ff; background: var(--primary-soft); font-weight: 650; }
    .timeline { position: relative; display: grid; gap: 4px; }
    .timeline-item { display: grid; grid-template-columns: 70px 20px 1fr auto; align-items: center; gap: 10px; min-height: 56px; }
    .timeline-time { color: var(--muted); font-size: 12px; text-align: right; }
    .timeline-node { width: 10px; height: 10px; margin: auto; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px #e9f9ff; }
    .timeline-item.done .row-title { text-decoration: line-through; color: var(--muted); }
    .packing-list { display: grid; gap: 3px; }
    .packing-item { min-height: 44px; display: flex; align-items: center; gap: 9px; }

    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .word-card { position: relative; height: 176px; perspective: 800px; background: transparent; border-radius: var(--radius-card); }
    .word-flip { width: 100%; height: 100%; padding: 0; perspective: 800px; background: transparent; cursor: pointer; border-radius: var(--radius-card); text-align: left; }
    .word-card-inner { position: relative; width: 100%; height: 100%; transition: transform .28s ease; transform-style: preserve-3d; }
    .word-flip.flipped .word-card-inner { transform: rotateY(180deg); }
    .word-face { position: absolute; inset: 0; padding: 19px; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border: 1px solid rgba(0,0,0,.05); border-radius: var(--radius-card); box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .word-back { transform: rotateY(180deg); background: #f2f1ff; }
    .word-name { margin: auto 0 0; font-size: 25px; font-weight: 720; letter-spacing: -.5px; color: var(--indigo); }
    .phonetic { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .meaning { margin: auto 0; font-size: 18px; font-weight: 650; line-height: 1.45; }
    .word-hint { color: var(--muted); font-size: 11px; }
    .word-delete { position: absolute; right: 9px; top: 8px; z-index: 2; }

    .fab { position: fixed; right: 24px; bottom: 24px; z-index: 30; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; box-shadow: 0 14px 32px rgba(0,113,227,.32); cursor: pointer; font-size: 26px; }
    .smart-panel { --smart-keyboard-offset: 0px; --smart-available-height: 500px; position: fixed; right: 24px; bottom: 94px; z-index: 30; width: min(380px, calc(100vw - 32px)); max-height: min(var(--smart-available-height), 500px); overflow: auto; overscroll-behavior: contain; padding: 18px; background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.06); border-radius: 20px; box-shadow: var(--shadow-float); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); transform-origin: bottom right; animation: smart-in .2s ease both; }
    @keyframes smart-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
    .smart-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .smart-head strong { flex: 1; font-size: 16px; }
    .smart-examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
    .smart-example { min-height: 30px; padding: 0 10px; border-radius: 999px; background: #f2f2f7; color: var(--muted); cursor: pointer; font-size: 12px; }
    .smart-submit { position: sticky; bottom: 0; z-index: 2; width: 100%; box-shadow: 0 -10px 22px rgba(250,252,255,.92); }
    .smart-result { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); color: #165f9f; font-size: 12px; line-height: 1.5; }

      }
      @keyframes todo-sheet-in { from { opacity: 0; transform: translateY(36px); } }
      .todo-sheet-handle { width: 38px; height: 4px; margin: 0 auto 16px; border-radius: 999px; background: #c7cad1; }
      .todo-sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .todo-sheet-head > div { flex: 1; }
      .todo-sheet-head h2 { margin: 0; font-size: 20px; letter-spacing: -.45px; }
      .todo-sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      .todo-sheet-form { display: grid; gap: 16px; }
      .todo-sheet-time-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .todo-sheet-time-grid .input { min-height: 48px; font-variant-numeric: tabular-nums; }
      .todo-sheet-priorities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .todo-sheet-priorities input { position: absolute; opacity: 0; pointer-events: none; }
      .todo-sheet-priorities label {
        min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 7px;
        border: 1px solid var(--border); border-radius: 12px; background: #fff; color: var(--muted); font-size: 13px; cursor: pointer;
      }
      .todo-sheet-priorities input:checked + label { color: var(--text); border-color: rgba(0,113,227,.36); background: var(--primary-soft); box-shadow: inset 0 0 0 1px rgba(0,113,227,.08); font-weight: 650; }
      .priority-dot { width: 7px; height: 7px; border-radius: 50%; background: #a8adb7; }
      .priority-dot.high { background: #e4483f; }
      .priority-dot.medium { background: #e6a122; }
      .todo-sheet-submit { width: 100%; min-height: 48px; }

      .todo-swipe { overflow: hidden; border-radius: 14px; touch-action: pan-y; }
      .todo-swipe-underlay {
        position: absolute; inset: 0; display: flex; align-items: stretch; justify-content: space-between;
        background: #eaf8ee; border-radius: inherit; overflow: hidden;
      }
      .todo-complete-cue { width: 88px; padding-left: 16px; display: flex; align-items: center; color: #23743a; font-size: 12px; font-weight: 700; }
      .todo-reveal-actions { margin-left: auto; display: flex; }
      .todo-swipe-action { width: 72px; min-height: 100%; display: grid; place-items: center; color: #fff; cursor: pointer; font-size: 12px; font-weight: 650; }
      .todo-swipe-action.defer { background: #687384; }
      .todo-swipe-action.delete { background: #d94a43; }
      .todo-swipe-content {
        position: relative; z-index: 1; background: var(--surface); will-change: transform;
        transition: transform .22s cubic-bezier(.2,.75,.25,1);
      }
      .todo-swipe.is-actions-open .todo-swipe-content { transform: translateX(-144px); }
      .todo-swipe.is-swiping .todo-swipe-content { transition: none; }
      .todo-swipe-content .icon-btn { display: grid; }
      .quick-jumps { grid-template-columns: repeat(2, 1fr); }
      .habit-matrix { grid-template-columns: minmax(96px, 1.35fr) repeat(7, 44px) 48px; }

      body.todo-sheet-open { overflow: hidden; }
      .fab { display: none; }
      .smart-panel { left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom) + var(--smart-keyboard-offset)); width: auto; max-height: min(var(--smart-available-height), 500px); transform-origin: bottom center; }
      .toast-region { top: 70px; right: 12px; left: 12px; }
      .toast { min-width: 0; max-width: none; }
    }

    @media (max-width: 420px) {
      .choice-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .mood-picker { grid-template-columns: repeat(3, 1fr); }
      .inline-form { flex-wrap: wrap; }
      .inline-form .btn { width: 100%; }
      .word-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .word-card-inner { transform: none !important; }
      .word-flip:not(.flipped) .word-back, .word-flip.flipped .word-front { display: none; }
      .word-face { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .sidebar, .mobile-topbar, .mobile-tabbar, .smart-panel, .modal-head { backdrop-filter: none; -webkit-backdrop-filter: none; background: #fff; }
    }

    /* 2026 visual refresh: a calm personal operating system */
    :root {
      --bg: #f1f4f8;
      --surface: rgba(255, 255, 255, .86);
      --surface-soft: #f5f7fa;
      --text: #17181b;
      --muted: #6b7080;
      --muted-2: #9297a3;
      --border: rgba(31, 39, 56, .08);
      --radius-card: 24px;
      --radius-control: 13px;
      --shadow: 0 18px 50px rgba(63, 76, 103, .09), 0 2px 8px rgba(63, 76, 103, .04);
      --shadow-float: 0 28px 80px rgba(39, 50, 72, .22), 0 4px 16px rgba(39, 50, 72, .08);
    }

    body {
      position: relative;
      isolation: isolate;
      background: #f1f4f8;
      --ambient: rgba(0, 113, 227, .12);
    }
    body[data-active-module="ledger"] { --ambient: rgba(52, 199, 89, .12); }
    body[data-active-module="fitness"] { --ambient: rgba(255, 149, 0, .13); }
    body[data-active-module="mood"] { --ambient: rgba(255, 55, 95, .11); }
    body[data-active-module="reading"] { --ambient: rgba(175, 82, 222, .12); }
    body[data-active-module="travel"] { --ambient: rgba(90, 200, 250, .16); }
    body[data-active-module="english"] { --ambient: rgba(88, 86, 214, .12); }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(900px 620px at 86% -12%, var(--ambient), transparent 67%),
        radial-gradient(720px 520px at 4% 104%, rgba(0, 113, 227, .055), transparent 68%),
        #f1f4f8;
      transition: background .5s ease;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .38;
      background-image: radial-gradient(rgba(44, 55, 76, .12) .55px, transparent .7px);
      background-size: 17px 17px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 52%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 52%);
    }

    .color-plan { --module: #0071e3; --module-soft: #e7f2ff; --module-action: #0068d1; }
    .color-ledger { --module: #34c759; --module-soft: #e9f9ed; --module-action: #248a3d; }
    .color-fitness { --module: #ff9500; --module-soft: #fff2de; --module-action: #b65d00; }
    .color-mood { --module: #ff375f; --module-soft: #ffecf1; --module-action: #d4264b; }
    .color-reading { --module: #af52de; --module-soft: #f7eafd; --module-action: #8f3db7; }
    .color-travel { --module: #5ac8fa; --module-soft: #e6f8ff; --module-action: #087fae; }
    .color-english { --module: #5856d6; --module-soft: #efefff; --module-action: #4b49bd; }

    .sidebar {
      inset: 14px auto 14px 14px;
      height: auto;
      padding: 18px 12px 14px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 28px;
      background: rgba(249, 251, 254, .82);
      box-shadow: 0 24px 70px rgba(55, 69, 95, .12), inset 0 1px 0 rgba(255,255,255,.95);
    }
    .brand { gap: 12px; padding: 4px 8px 22px; }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #171b24;
      box-shadow: 0 10px 24px rgba(23,27,36,.2), inset 0 1px 0 rgba(255,255,255,.16);
      font-size: 17px;
    }
    .brand strong { font-size: 15px; font-weight: 720; letter-spacing: -.45px; }
    .brand small { margin-top: 4px; font-size: 10.5px; color: #858a97; }
    .nav { gap: 6px; }
    .nav-btn, .utility-btn {
      position: relative;
      min-height: 47px;
      border-radius: 15px;
      padding-inline: 10px;
      color: #555b69;
      font-weight: 540;
      transition: background .22s ease, color .22s ease, transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease;
    }
    .nav-btn:hover, .utility-btn:hover { background: rgba(255,255,255,.72); transform: translateX(2px); }
    .nav-btn.active {
      color: #17181b;
      background: rgba(255,255,255,.92);
      box-shadow: 0 10px 28px rgba(51,67,94,.10), inset 0 0 0 1px rgba(255,255,255,.9);
      font-weight: 660;
    }
    .nav-btn.active::after {
      content: "";
      position: absolute;
      right: -3px;
      width: 4px;
      height: 18px;
      border-radius: 99px;
      background: var(--module-color, var(--primary));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--module-color, var(--primary)) 10%, transparent);
    }
    .nav-icon {
      width: 30px;
      height: 30px;
      flex-basis: 30px;
      border-radius: 11px;
      font-size: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 5px 12px color-mix(in srgb, var(--icon) 22%, transparent);
    }
    .sidebar-tools { padding-top: 10px; border-color: rgba(31,39,56,.07); }
    .utility-btn { min-height: 42px; border-radius: 13px; color: #777c89; }
    .utility-symbol { font-size: 15px; color: #3f4552; }

    .main { margin-left: 248px; }
    .content { width: min(100%, 1380px); padding: 38px 42px 100px 26px; }
    .page { position: relative; }
    .page-head { align-items: center; margin: 2px 0 30px; }
    .page-identity { display: flex; align-items: center; gap: 17px; min-width: 0; }
    .page-glyph {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      color: var(--module);
      background:
        radial-gradient(circle at 24% 12%, rgba(255,255,255,.9), transparent 42%),
        var(--module-soft);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.85), 0 14px 30px color-mix(in srgb, var(--module) 15%, transparent);
      font-size: 20px;
      font-weight: 760;
    }
    .page-title { font-size: clamp(31px, 3vw, 40px); font-weight: 760; line-height: 1.04; letter-spacing: -1.5px; text-wrap: balance; }
    .page-subtitle { margin-top: 8px; max-width: 58ch; color: #727785; line-height: 1.55; text-wrap: pretty; }
    .today-chip {
      min-width: 126px;
      padding: 10px 13px 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      border-radius: 15px;
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.82);
      color: #8a8f9b;
      font-size: 11px;
      backdrop-filter: blur(12px);
    }
    .today-chip strong { color: #343945; font-size: 12px; font-variant-numeric: tabular-nums; }

    .card {
      border: 1px solid rgba(255,255,255,.84);
      background: rgba(255,255,255,.84);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
    }
    .card.life-level-card {
      color: #fff;
      border-color: rgba(255,255,255,.12);
      background: radial-gradient(420px 180px at 100% 0%, rgba(90,200,250,.3), transparent 70%), linear-gradient(135deg,#171b24,#313949);
      box-shadow: 0 24px 52px rgba(35,45,65,.2), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .life-level-card .progress-copy { color: rgba(255,255,255,.68); }
    .life-level-card .progress-copy strong { color: #fff; }
    .card-pad { padding: 23px; }
    .section-title { font-size: 17px; font-weight: 690; letter-spacing: -.38px; }
    .section-note { max-width: 65ch; color: #7b808c; line-height: 1.55; text-wrap: pretty; }
    .section-head { margin-bottom: 18px; }
    .grid-main-side, .grid-two, .trip-layout { gap: 22px; }
    .grid-cards { gap: 18px; }
    .grid-main-side > aside.card,
    .grid-two > .card:nth-child(2) {
      background:
        radial-gradient(420px 240px at 112% -18%, color-mix(in srgb, var(--module) 12%, transparent), transparent 68%),
        rgba(255,255,255,.83);
    }

    .page .btn:not(.secondary):not(.ghost):not(.danger) {
      background: var(--module-action);
      box-shadow: 0 8px 18px color-mix(in srgb, var(--module) 20%, transparent), inset 0 1px 0 rgba(255,255,255,.2);
    }
    .btn { min-height: 46px; border-radius: 13px; letter-spacing: -.1px; }
    .btn:hover { filter: brightness(1.03); transform: translateY(-1px); }
    .btn.secondary { background: rgba(255,255,255,.8); border-color: rgba(31,39,56,.09); }
    .btn.ghost { box-shadow: none; }
    .input, .select, .textarea {
      min-height: 46px;
      border-color: transparent;
      background: #f3f5f8;
      box-shadow: inset 0 0 0 1px rgba(35,44,61,.055), inset 0 1px 2px rgba(35,44,61,.025);
    }
    .input:hover, .select:hover, .textarea:hover { background: #f0f3f7; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: transparent;
      background: #fff;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--module, var(--primary)) 18%, transparent), inset 0 0 0 1px var(--module, var(--primary));
    }
    .input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { background: #fff8f8; box-shadow: 0 0 0 3px rgba(201,52,46,.12), inset 0 0 0 1px rgba(201,52,46,.55); }
    .form-message { background: rgba(255,240,240,.92); box-shadow: inset 3px 0 0 #c9342e; }
    .form-advanced summary { transition: color .18s ease; }
    .form-advanced[open] summary { color: var(--module-action, var(--primary)); }
    .preset-btn { background: #edf0f4; }
    .quick-form {
      padding: 17px;
      border-color: rgba(31,39,56,.055);
      border-radius: 18px;
      background: rgba(244,246,249,.78);
      box-shadow: inset 0 1px 2px rgba(44,55,75,.025);
    }
    .segmented { padding: 4px; border-radius: 13px; background: #e8ebf0; }
    .segmented label { border-radius: 10px; }
    .segmented input:checked + label { box-shadow: 0 5px 14px rgba(43,54,75,.12); }

    .summary-strip {
      position: relative;
      overflow: hidden;
      grid-template-columns: 1.22fr 1fr 1fr;
      padding: 21px 10px;
      border: 1px solid rgba(255,255,255,.78);
      background:
        radial-gradient(460px 180px at 8% -10%, color-mix(in srgb, var(--module) 14%, transparent), transparent 70%),
        rgba(255,255,255,.78);
    }
    .summary-strip::after {
      content: "";
      position: absolute;
      right: -52px;
      top: -78px;
      width: 180px;
      height: 180px;
      border: 28px solid color-mix(in srgb, var(--module) 7%, transparent);
      border-radius: 50%;
      pointer-events: none;
    }
    .metric { position: relative; z-index: 1; padding: 7px 21px 8px; }
    .metric + .metric { border-left-color: rgba(31,39,56,.075); }
    .metric-label { color: #7c818d; font-weight: 580; letter-spacing: .02em; }
    .metric-value { margin-top: 9px; font-size: clamp(27px, 3vw, 36px); font-weight: 750; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

    .list { gap: 4px; }
    .list-row { min-height: 64px; padding: 11px 10px; border: 0; border-radius: 15px; transition: background .18s ease, transform .18s ease; }
    .list-row:hover { background: rgba(243,245,249,.92); transform: translateX(2px); }
    .row-title { color: #343842; font-weight: 510; text-wrap: pretty; }
    .row-meta { color: #888d98; font-variant-numeric: tabular-nums; }
    .icon-btn { border-radius: 12px; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .icon-btn:hover { background: #eef1f5; }
    .check { border-color: #c4c9d2; border-radius: 8px; }
    .page .check:checked { background: var(--module-action); border-color: var(--module-action); }
    .badge { padding-inline: 10px; font-weight: 680; }

    .progress-ring { width: 160px; height: 160px; }
    .ring-track { stroke: #e9edf2; }
    .ring-value { stroke: var(--module); filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--module) 22%, transparent)); }
    .ring-copy strong { font-size: 34px; font-weight: 760; }
    .mini-stats { gap: 10px; }
    .mini-stat { padding-block: 13px; border-radius: 15px; background: rgba(245,247,250,.92); }
    .mini-stat strong { font-variant-numeric: tabular-nums; }
    .empty { padding-block: 48px; }
    .empty-symbol { width: 54px; height: 54px; border-radius: 18px; color: var(--module); background: var(--module-soft); box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }

    .chart-wrap { border-radius: 18px; background: rgba(247,248,251,.65); padding: 10px 4px 2px; }
    .chart-caption { margin: 10px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .confirm-dialog .btn.danger { background: #c9342e; color: #fff; }
    .choice label { min-height: 56px; border-color: transparent; background: #f3f5f8; border-radius: 15px; }
    .choice label:hover { background: #edf0f5; transform: translateY(-1px); }
    .choice input:checked + label { border-color: var(--module); color: var(--module-action); background: var(--module-soft); box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }
    .heat-day { padding-block: 13px; border-radius: 15px; background: #f1f3f6; }
    .heat-1 { background: #fff3e1; } .heat-2 { background: #ffdda9; } .heat-3 { background: #ffb44a; }
    .streak strong { color: var(--module-action); }
    .mood-option label { min-height: 64px; border-radius: 18px; background: #f3f5f8; filter: grayscale(.15); transition: transform .2s ease, filter .2s ease, background .2s ease; }
    .mood-option label:hover { transform: translateY(-3px) rotate(-2deg); filter: none; }
    .mood-option input:checked + label { border-color: var(--module); background: var(--module-soft); filter: none; box-shadow: 0 10px 24px color-mix(in srgb, var(--module) 13%, transparent); }

    .book-card { position: relative; overflow: hidden; padding: 23px; transition: transform .22s ease, box-shadow .22s ease; }
    .book-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--module);
      opacity: .78;
    }
    .book-card:hover { transform: translateY(-3px); box-shadow: 0 24px 58px rgba(72,60,92,.14); }
    .book-title { font-size: 20px; font-weight: 720; }
    .progress { height: 8px; background: #eaedf2; }
    .progress > span { background: var(--module); box-shadow: 0 2px 8px color-mix(in srgb, var(--module) 24%, transparent); }
    details.notes summary { color: var(--module-action); }

    .trip-tabs { gap: 9px; padding-bottom: 13px; }
    .trip-tab { min-height: 41px; border: 0; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px rgba(31,39,56,.07); }
    .trip-tab.active { color: var(--module-action); border: 0; background: var(--module-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--module) 30%, transparent); }
    .trip-destination { font-size: 27px; font-weight: 740; }
    .timeline-node { background: var(--module-action); box-shadow: 0 0 0 5px var(--module-soft); }

    .word-grid { gap: 18px; }
    .word-card { height: auto; min-height: 190px; background: rgba(255,255,255,.86); box-shadow: var(--shadow); }
    .word-flip { height: 190px; }
    .word-card .word-face { box-shadow: none; }
    .word-face { padding: 22px; border: 1px solid rgba(255,255,255,.86); border-radius: 22px; background: rgba(255,255,255,.86); box-shadow: var(--shadow); }
    .word-front { background: radial-gradient(240px 150px at 100% 0%, var(--module-soft), transparent 72%), rgba(255,255,255,.9); }
    .word-back { background: var(--module-soft); }
    .word-name { font-size: 29px; color: var(--module-action); font-weight: 760; }
    .word-flip:hover .word-face { box-shadow: 0 24px 56px color-mix(in srgb, var(--module) 12%, rgba(63,76,103,.08)); }

    .fab {
      right: 26px;
      bottom: 24px;
      width: auto;
      min-width: 132px;
      height: 58px;
      padding: 0 10px 0 18px;
      display: flex;
      gap: 12px;
      border-radius: 19px;
      background: #171b24;
      box-shadow: 0 18px 40px rgba(23,27,36,.25), inset 0 1px 0 rgba(255,255,255,.14);
      font-size: 24px;
    }
    .fab-label { font-size: 13px; font-weight: 650; letter-spacing: -.1px; }
    .fab:hover { transform: translateY(-3px); background: #222834; }
    .smart-panel {
      right: 26px;
      bottom: 94px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 25px;
      background:
        radial-gradient(360px 180px at 100% 0%, rgba(0,113,227,.10), transparent 68%),
        rgba(250,252,255,.92);
      box-shadow: var(--shadow-float), inset 0 1px 0 rgba(255,255,255,.85);
    }
    .smart-head { margin-bottom: 16px; }
    .smart-head > span { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px; background: #171b24; font-size: 21px; }
    .smart-example { background: rgba(235,239,245,.9); color: #606674; }
    .smart-result { border-radius: 13px; }

    .overlay { background: rgba(33,39,52,.28); backdrop-filter: blur(8px); }
    .modal { border: 1px solid rgba(255,255,255,.8); border-radius: 28px; background: #f3f5f8; }
    .modal-head { padding: 22px 24px; background: rgba(248,250,253,.9); border-color: rgba(31,39,56,.07); }
    .modal-head h2 { font-size: 23px; letter-spacing: -.55px; }
    .modal-body { padding: 24px; }
    .analysis-lead { border-radius: 18px; background: radial-gradient(420px 150px at 100% 0%, rgba(0,113,227,.13), transparent 75%), #eaf4ff; }
    .analysis-rows { border-radius: 20px; box-shadow: var(--shadow); }

    .home-metric-card { min-width: 0; }
    .home-metric-card[data-dashboard-card="reading"]:not([data-card-state="empty"]) .home-card-primary { font-size: 20px; font-weight: 700; }
    .home-card-body { min-width: 0; }

    /* Selected direction: Tactile Life Archive / 柔彩生活档案 */
    :root {
      --bg: #f7f2e9;
      --surface: #fffdf8;
      --surface-soft: #faf6ef;
      --text: #2d2721;
      --muted: #756b61;
      --muted-2: #a19589;
      --border: rgba(87, 66, 49, .14);
      --primary: #ec7042;
      --primary-soft: #fff0e8;
      --green: #3e9b91;
      --orange: #d99a17;
      --pink: #ec7042;
      --purple: #9c7663;
      --cyan: #6b9bc0;
      --indigo: #5c92bf;
      --danger: #c8553d;
      --radius-card: 15px;
      --radius-control: 11px;
      --shadow: 0 7px 22px rgba(83, 60, 39, .07), 0 1px 2px rgba(83, 60, 39, .05);
      --shadow-float: 0 22px 60px rgba(73, 52, 35, .19), 0 3px 12px rgba(73, 52, 35, .08);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    html, body { background-color: var(--bg); }
    body {
      background-image: url("assets/paper-texture.webp");
      background-size: 760px 760px;
      background-blend-mode: soft-light;
      background-attachment: fixed;
      color: var(--text);
    }
    body::before, body::after { display: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { box-shadow: 0 0 0 3px rgba(231,111,66,.2); }

    .color-plan { --module: #5c92bf; --module-soft: #eef5fa; --module-action: #4e82ad; }
    body[data-active-module="home"] .color-plan,
    body[data-active-module="goals"] .color-plan { --module: #ec7042; --module-soft: #fff1e9; --module-action: #d6633a; }
    .color-ledger { --module: #d99a17; --module-soft: #fbf3dc; --module-action: #c5890f; }
    .color-fitness { --module: #3e9b91; --module-soft: #e9f5f1; --module-action: #2e837b; }
    .color-mood { --module: #6b9bc0; --module-soft: #eef5fa; --module-action: #4f83a8; }
    .color-reading { --module: #ec7042; --module-soft: #fff1e9; --module-action: #d6633a; }
    .color-travel { --module: #5c92bf; --module-soft: #eef5fa; --module-action: #4e82ad; }
    .color-english { --module: #5c92bf; --module-soft: #eef5fa; --module-action: #4e82ad; }

    .sidebar {
      border-color: rgba(92,72,53,.13);
      background: rgba(255,250,242,.96);
      box-shadow: 0 16px 44px rgba(82,59,39,.1);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .brand-mark {
      color: #fffaf2;
      background: #e76f42;
      box-shadow: 0 8px 18px rgba(231,111,66,.2);
    }
    .brand strong { font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 700; }
    .nav-btn, .utility-btn { color: #6f655c; }
    .nav-btn:hover, .utility-btn:hover { background: #fbf4ea; }
    .nav-btn.active { color: var(--text); background: #fff8ee; box-shadow: inset 0 0 0 1px var(--border), 0 5px 14px rgba(82,59,39,.06); }
    .nav-btn.active::after { background: var(--module-color); box-shadow: none; }
    .nav-icon {
      color: var(--icon, var(--primary));
      background: color-mix(in srgb, var(--icon, var(--primary)) 12%, #fffaf2);
      border: 1px solid color-mix(in srgb, var(--icon, var(--primary)) 20%, transparent);
      box-shadow: none;
      font-size: 16px;
    }
    .sidebar-tools { border-color: var(--border); }

    .content { padding-top: 34px; }
    .page-head { margin-bottom: 25px; }
    .page-glyph {
      color: var(--module);
      background: var(--module-soft);
      border: 1px solid color-mix(in srgb, var(--module) 20%, transparent);
      box-shadow: 3px 3px 0 color-mix(in srgb, var(--module) 10%, transparent);
    }
    .page-title, .mobile-topbar strong, .archive-greeting h2, .trip-destination {
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      font-weight: 700;
    }
    .page-title { color: #2b241e; font-size: clamp(31px, 3vw, 39px); letter-spacing: -.8px; }
    .page-subtitle { color: var(--muted); }
    .today-chip { color: var(--muted); background: rgba(255,250,242,.78); box-shadow: inset 0 0 0 1px var(--border); backdrop-filter: none; }

    .card {
      border-color: var(--border);
      background: rgba(255,250,242,.94);
      box-shadow: var(--shadow);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .grid-main-side > aside.card, .grid-two > .card:nth-child(2) { background: rgba(255,250,242,.94); }
    .card-pad { padding: 21px; }
    .section-title { color: #352d26; font-weight: 700; }
    .section-note, .row-meta, .chart-caption { color: var(--muted); }
    .list-row { border-radius: 11px; }
    .list-row:hover { background: #fbf4ea; }
    .row-title { color: #40372f; }

    .archive-greeting {
      min-height: 142px;
      margin-bottom: 18px;
      padding: 23px 220px 22px 23px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255,250,242,.93);
      box-shadow: var(--shadow);
    }
    .archive-greeting-copy { position: relative; z-index: 1; max-width: 630px; }
    .archive-kicker { display: inline-flex; align-items: center; gap: 6px; color: #b07b12; font-size: 12px; font-weight: 650; }
    .archive-greeting h2 { margin: 8px 0 5px; color: #352d26; font-size: 22px; letter-spacing: .05em; }
    .archive-greeting p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .archive-greeting img { position: absolute; right: -16px; top: -36px; width: 230px; height: 190px; object-fit: cover; object-position: center; opacity: .92; transform: rotate(2deg); }

    .summary-strip {
      border-color: var(--border);
      background: rgba(255,250,242,.93);
      box-shadow: var(--shadow);
    }
    .summary-strip::after { display: none; }
    .metric + .metric { border-color: var(--border); }
    .metric-label { color: var(--muted); }
    .metric-value { color: #352d26; font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 600; }
    .money-income { color: #287d75; }
    .money-expense { color: #cf5f37; }

    .page .btn:not(.secondary):not(.ghost):not(.danger) { background: var(--module-action); box-shadow: none; }
    .btn { border-radius: 10px; box-shadow: none; }
    .btn:hover { filter: none; transform: translateY(-1px); }
    .btn.secondary { color: #4b4036; border-color: var(--border); background: #fffaf2; }
    .btn.ghost { color: var(--module-action, var(--muted)); }
    .input, .select, .textarea {
      color: var(--text);
      border-color: transparent;
      background: #f7f0e6;
      box-shadow: inset 0 0 0 1px rgba(92,72,53,.1);
    }
    .input:hover, .select:hover, .textarea:hover { background: #f4ecdf; }
    .input:focus, .select:focus, .textarea:focus { background: #fffaf2; box-shadow: 0 0 0 3px color-mix(in srgb, var(--module, var(--primary)) 16%, transparent), inset 0 0 0 1px var(--module, var(--primary)); }
    .quick-form { border-color: var(--border); background: #faf4ea; box-shadow: none; }
    .segmented { background: #eee6da; }
    .segmented input:checked + label, .segmented button[aria-pressed="true"] { background: #fffaf2; box-shadow: 0 2px 8px rgba(82,59,39,.08); }

    .progress { background: #ebe3d7; }
    .progress > span { background: var(--module); box-shadow: none; }
    .ring-track { stroke: #ebe3d7; }
    .ring-value { stroke: var(--module); filter: none; }
    .mini-stat, .daily-summary-stat, .budget-item, .insight-item { background: #f8f1e7; }
    .choice label, .mood-option label, .habit-check { background: #f8f1e7; }
    .choice label:hover { background: #f2e9dc; }
    .chart-wrap { background: #fbf5ec; }
    .chart-empty { background: rgba(251,245,236,.9); }
    .empty-symbol { color: var(--module); background: var(--module-soft); box-shadow: none; }
    .badge { border-radius: 7px; }

    .mood-picker { gap: 9px; }
    .mood-option label { min-height: 74px; gap: 3px; border-radius: 12px; color: #756a60; font-size: 23px; }
    .mood-option label span { font-size: 10px; }
    .mood-option input:checked + label { color: var(--module-action); border-color: var(--module); background: var(--module-soft); box-shadow: 3px 3px 0 color-mix(in srgb, var(--module) 10%, transparent); }
    .mood-list-icon { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border-radius: 50%; color: #547f9f; background: #edf4f8; font-size: 20px; }

    .book-card { border-left: 1px solid var(--border); }
    .book-card::before { display: none; }
    .color-reading .book-card:first-child {
      min-height: 190px;
      padding-right: 195px;
      background-color: rgba(255,250,242,.96);
      background-image: url("assets/reading-still-life.webp");
      background-repeat: no-repeat;
      background-position: right 18px center;
      background-size: 150px 112px;
    }
    .reading-intro {
      min-height: 176px;
      margin-bottom: 18px;

      display: grid;
      grid-template-columns: 210px 1fr;
      align-items: center;

      border-radius: 15px;
      background: rgba(255,250,242,.94);
      box-shadow: var(--shadow);

    .reading-intro h2 { margin: 8px 0 6px; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 22px; }
    .reading-intro p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .word-front { background: #f2f6f7; }
    .word-back { background: var(--module-soft); }
    .word-name { color: var(--module-action); font-family: "Noto Serif SC", Georgia, serif; font-weight: 600; }

    .card.life-level-card {
      color: var(--text);
      border-color: var(--border);
      background: #f8eed7;
      box-shadow: 4px 4px 0 rgba(207,148,25,.12);

    .achievement-badge.locked { color: #9b8d7e; }
    .backup-status { color: #287d75; background: #e9f5f1; }
    .backup-status::before { background: #3f988f; }

    .fab { background: #e76f42; box-shadow: 0 13px 28px rgba(231,111,66,.25); }
    .fab:hover { background: #d9633a; }
    .smart-panel { border-color: var(--border); background: #fffaf2; box-shadow: var(--shadow-float); }
    .smart-head > span { color: #fffaf2; background: #e76f42; }
    .smart-example { color: var(--muted); background: #f4ecdf; }
    .smart-result { color: #486f8d; background: #edf4f8; }
    .overlay { background: rgba(61,47,35,.28); }
    .modal, .modal-head { border-color: var(--border); background: #f4efe6; }
    .analysis-lead { color: #486f8d; background: #edf4f8; }
    .mobile-archive-screen,
    .archive-detail-toolbar { display: none; }

    @media (max-width: 767px) {
      body { background-size: 390px 390px; }

        position: sticky;
        top: 0;
        height: auto;
        min-height: 94px;
        padding: max(17px, env(safe-area-inset-top)) 16px 12px;
        align-items: flex-end;
        border: 0;
        background: rgba(244,239,230,.96);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .mobile-heading { min-width: 0; flex: 1; display: grid; gap: 4px; }

  const GOAL_STATUSES = {active:'进行中',paused:'已暂停',completed:'已完成'};
  const MOODS = [
    {emoji:'😄', icon:'ph-smiley', score:6, label:'开心'}, {emoji:'😊', icon:'ph-smiley-wink', score:5, label:'愉快'},
    {emoji:'😐', icon:'ph-smiley-meh', score:4, label:'平静'}, {emoji:'😔', icon:'ph-smiley-sad', score:3, label:'低落'},

  let lastFocus = null;
  let lastSnapshot = null;

  const defaultState = () => ({
    schemaVersion: APP_VERSION,
    meta: { createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
    settings: { dailyWordGoal: 10, monthlyBudget: 0, categoryBudgets: {} },

  const pad = n => String(n).padStart(2, '0');

  function validDate(s){

  function validClockTime(value){ return /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(String(value||'')); }

  function defaultTodoSlot(index){

  function mutate(fn,{message='',undo=true}={}){

    if(!persist()){ state=JSON.parse(rollback);render();return false; }

    }
    return true;
  }

  function recalculateGoal(goal){
    if(!goal)return;
    const keyResults=Array.isArray(goal.keyResults)?goal.keyResults:[];
    if(keyResults.length){
      keyResults.forEach(kr=>{kr.current=clamp(Number(kr.current)||0,0,Number(kr.target)||1);kr.completed=kr.current>=kr.target;});
      goal.progress=Math.round(keyResults.reduce((sum,kr)=>sum+kr.current/kr.target,0)/keyResults.length*100);
      if(goal.archivedAt){goal.progress=100;goal.status='completed';}
      else if(goal.progress>=100)goal.status='completed';
      else if(goal.status==='completed')goal.status='active';
    }
    goal.updatedAt=nowIso();
  }

    const streak=workoutStreak();

            <div class="preset-row" aria-label="常用运动时长">${[15,30,45,60].map(value=>`<button class="preset-btn" type="button" data-action="set-field" data-target="fitnessMinutes" data-value="${value}">${value} 分钟</button>`).join('')}</div>
            <div class="form-row" style="margin-top:14px">
              <div class="field span-4"><label for="fitnessMinutes">时长（分钟）</label><input class="input" id="fitnessMinutes" name="minutes" type="number" min="1" max="1440" inputmode="numeric" required placeholder="30"></div>

        </div>
        <aside class="card card-pad"><div class="section-head"><div><h2 class="section-title">本周热力图</h2><p class="section-note">颜色越深，运动时长越长。</p></div></div>

  function workoutStreak(){
    const days=new Set(state.fitness.workouts.map(x=>x.date)); let cursor=days.has(dateKey())?dateKey():shiftDay(dateKey(),-1),count=0;
    while(days.has(cursor)){count++;cursor=shiftDay(cursor,-1);} return count;
  }

  function moodInsights(){
    const entries=state.mood.entries.filter(x=>x.date>=shiftDay(dateKey(),-89)),byDate={};
    entries.forEach(x=>(byDate[x.date]||(byDate[x.date]=[])).push(x.score));
    const averageFor=date=>{const scores=byDate[date];return scores?.length?scores.reduce((sum,score)=>sum+score,0)/scores.length:null;};
    const sportDates=[...new Set(entries.filter(x=>(x.tags||[]).includes('运动')).map(x=>x.date))];
    const sportPairs=sportDates.map(date=>[averageFor(date),averageFor(shiftDay(date,-1))]).filter(pair=>pair.every(Number.isFinite));
    const sportBetter=sportPairs.filter(([current,previous])=>current>previous).length;
    const sleepNext=[...new Set(entries.filter(x=>(x.tags||[]).includes('熬夜')).map(x=>shiftDay(x.date,1)))].map(averageFor).filter(Number.isFinite);
    const overall=entries.length?entries.reduce((sum,x)=>sum+x.score,0)/entries.length:null;
    const sleepDelta=sleepNext.length&&overall!==null?sleepNext.reduce((sum,x)=>sum+x,0)/sleepNext.length-overall:null;
    const tagStats=MOOD_TAGS.map(tag=>{const xs=entries.filter(x=>(x.tags||[]).includes(tag));return {tag,count:xs.length,average:xs.length?xs.reduce((sum,x)=>sum+x.score,0)/xs.length:0};}).filter(x=>x.count>=2).sort((a,b)=>b.average-a.average||b.count-a.count);
    const positive=tagStats[0];
    return [
      {title:'运动后的变化',copy:sportPairs.length?`${sportPairs.length} 组可比较记录中，有 ${sportBetter} 次高于前一日，改善概率 ${Math.round(sportBetter/sportPairs.length*100)}%。`:'还需要“运动”标签与前一日心情记录，才能计算改善概率。'},
      {title:'熬夜的次日影响',copy:sleepDelta===null?'还需要“熬夜”标签及次日心情记录，才能观察影响。':`熬夜后的次日心情平均比近 90 天均值${sleepDelta>=0?'高':'低'} ${Math.abs(sleepDelta).toFixed(1)} 分（${sleepNext.length} 个样本）。`},
      {title:'高分关联因素',copy:positive?`#${positive.tag} 的平均心情为 ${positive.average.toFixed(1)} 分，共 ${positive.count} 条记录。`:'同一标签累计 2 条记录后，会显示与高分心情关联最强的因素。'}
    ];
  }

          <details class="form-advanced" style="margin-top:12px"><summary>补充可能的触发因素</summary><div class="field" style="padding-bottom:12px"><span class="field-label">可多选</span><div class="tag-picker">${MOOD_TAGS.map((tag,i)=>`<span class="tag-choice"><input id="moodTag${i}" name="tags" type="checkbox" value="${esc(tag)}"><label for="moodTag${i}">#${esc(tag)}</label></span>`).join('')}</div></div></details>
          <div class="form-row" style="margin-top:12px"><div class="field span-6"><label for="moodDate">日期</label><input class="input" id="moodDate" name="date" type="date" value="${dateKey()}" required></div><button class="btn span-6" type="submit">保存心情</button></div>

      </div>
      <div class="card card-pad" style="margin-top:20px"><div class="section-head"><div><h2 class="section-title">情绪标签洞察</h2><p class="section-note">基于最近 90 天的本地记录推算，样本越多越可靠。</p></div></div><div class="insight-grid">${insights.map(x=>`<div class="insight-item"><strong>${esc(x.title)}</strong><p>${esc(x.copy)}</p></div>`).join('')}</div></div>
      <div class="card card-pad" style="margin-top:20px"><div class="section-head"><div><h2 class="section-title">生活动态关联</h2><p class="section-note">运动、阅读和完成事项会自动出现在这里，帮助你回看情绪背景。</p></div></div><div class="list">${renderActivityList(5)}</div></div>
      <div class="card card-pad" style="margin-top:20px"><div class="section-head"><div><h2 class="section-title">最近日记</h2><p class="section-note">你的情绪会被认真保存在这台设备上。</p></div></div>
        <div class="list">${recent.length?recent.map(x=>{const mood=MOODS.find(m=>m.score===x.score);return `<div class="list-row"><div class="mood-list-icon" aria-label="${mood?.label||'心情'}"><i class="ph ${mood?.icon||'ph-flower-lotus'}" aria-hidden="true"></i></div><div class="row-main"><div class="row-title">${esc(x.text||'只记录了心情，没有写下文字。')}</div><div class="row-meta">${formatFullDate(x.date)}${(x.tags||[]).length?` · ${(x.tags||[]).map(tag=>`<span class="mood-tag">#${esc(tag)}</span>`).join(' ')}`:''}</div></div><button class="btn ghost small" type="button" data-action="reuse-mood" data-id="${x.id}">复用</button><button class="icon-btn" data-action="delete-mood" data-id="${x.id}" aria-label="删除心情日记"><i class="ph ph-x" aria-hidden="true"></i></button></div>`;}).join(''):emptyState('心','还没有心情日记','不需要写很多，先选一个最贴近此刻的状态。')}</div>
      </div>
    </section>`;
  }

            ${book.notes.length?book.notes.slice().reverse().map(n=>`<div class="note-item"><span class="badge badge-${n.kind==='highlight'?'medium':'low'}">${n.kind==='highlight'?'画线':'笔记'}</span><div style="margin-top:7px">${esc(n.text)}</div><div class="row-meta">${formatDate(n.date||dateKey())} · 第 ${n.page??book.currentPage} 页 <button class="btn ghost small" data-action="delete-note" data-book-id="${book.id}" data-id="${n.id}" type="button">删除</button></div></div>`).join(''):'<p class="section-note">还没有笔记。</p>'}

  function habitStreak(habit){
    const days=new Set(habit.dates||[]),leave=new Set(habit.leaveDates||[]),active=new Set([...days,...leave]);
    let cursor=active.has(dateKey())?dateKey():shiftDay(dateKey(),-1),count=0;
    while(active.has(cursor)){if(days.has(cursor))count++;cursor=shiftDay(cursor,-1);}return count;
  }

  function renderHabits(){
    const dates=weekDates(),today=dateKey(),items=state.habits.items;

          <div class="packing-list">${trip.packing.map(x=>`<div class="packing-item ${x.done?'completed':''}"><input class="check" type="checkbox" ${x.done?'checked':''} data-action="toggle-packing" data-trip-id="${trip.id}" data-id="${x.id}" aria-label="切换打包状态"><div class="row-title" style="flex:1">${esc(x.text)}</div><button class="icon-btn" data-action="delete-packing" data-trip-id="${trip.id}" data-id="${x.id}" aria-label="删除清单项">×</button></div>`).join('')}</div>
        </aside>
      </div>
    </div>`;

  function initActiveCharts(){

  const chartPalette=['#cf9419','#6f9fc2','#e76f42','#9c7663','#3f988f','#5d8fba','#d6aa5c','#82aaa4','#c47b5e','#91a9bb','#b58f78','#9f968c'];

  function releaseCanvas(canvas,key){
    const known=chartInstances.get(key);if(known){try{known.destroy();}catch(_){}chartInstances.delete(key);}
    if(window.Chart?.getChart){const attached=Chart.getChart(canvas);if(attached){try{attached.destroy();}catch(_){}}}
  }

  function setupCanvas(canvas){
    const rect=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(rect.width*ratio)); canvas.height=Math.max(1,Math.floor(rect.height*ratio));
    const ctx=canvas.getContext('2d'); ctx.setTransform(ratio,0,0,ratio,0,0); return {ctx,w:rect.width,h:rect.height};
  }

  function drawLedgerChart(){
    const canvas=document.getElementById('ledgerChart'); if(!canvas) return;
    releaseCanvas(canvas,'ledger');
    const month=ledgerMonth, totals={};
    state.ledger.entries.filter(x=>x.type==='expense'&&x.date.startsWith(month)).forEach(x=>totals[x.category]=(totals[x.category]||0)+x.amount);
    const labels=Object.keys(totals).sort((a,b)=>totals[b]-totals[a]), values=labels.map(x=>totals[x]), total=values.reduce((a,b)=>a+b,0);
    const legend=document.getElementById('ledgerLegend');
    legend.innerHTML=labels.slice(0,7).map((x,i)=>`<div class="legend-row"><span class="legend-swatch" style="background:${chartPalette[i]}"></span><span>${esc(x)}</span><strong>${total?Math.round(totals[x]/total*100):0}%</strong></div>`).join('');
    if(!values.length){ clearCanvas(canvas); return; }
    if(window.Chart){
      const chart=new Chart(canvas,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:chartPalette.slice(0,labels.length),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${money(c.raw)}`}}},animation:{duration:500}}}); chartInstances.set('ledger',chart);
    } else drawDonutFallback(canvas,values,labels);
  }

  function drawLedgerMobileChart(){
    const canvas=document.getElementById('ledgerMobileChart');if(!canvas)return;

    }else drawDonutFallback(canvas,values,['支出','剩余']);

  function reviewWord(wordId,rating){
    if(!['easy','fuzzy','forgot'].includes(rating))return;
    const word=state.english.words.find(x=>x.id===wordId),today=dateKey();if(!word||word.mastered||word.nextReviewDate>today)return;
    const currentInterval=clamp(Math.round(Number(word.intervalDays)||1),1,3650),currentEase=clamp(Number(word.easeFactor)||2.5,1.3,3);
    let intervalDays,easeFactor=currentEase;
    if(rating==='forgot'){intervalDays=1;easeFactor=Math.max(1.3,currentEase-.2);}
    else if(rating==='fuzzy'){intervalDays=currentInterval<=1?2:Math.max(2,Math.round(currentInterval*1.5));easeFactor=Math.max(1.3,currentEase-.05);}
    else {intervalDays=(word.reviewCount||0)===0?3:(word.reviewCount||0)===1?7:Math.max(3,Math.round(currentInterval*currentEase));easeFactor=Math.min(3,currentEase+.1);}
    intervalDays=clamp(intervalDays,1,3650);
    const nextDate=shiftDay(today,intervalDays),ratingLabel={easy:'简单',fuzzy:'模糊',forgot:'忘记'}[rating];
    mutate(s=>{const item=s.english.words.find(x=>x.id===wordId);if(!item)return;item.reviewCount=(item.reviewCount||0)+1;item.lapseCount=(item.lapseCount||0)+(rating==='forgot'?1:0);item.intervalDays=intervalDays;item.easeFactor=Number(easeFactor.toFixed(2));item.lastReviewedAt=nowIso();item.nextReviewDate=nextDate;item.mastered=false;s.english.studyLogs.push({id:id(),wordId,date:today,action:'review',rating,intervalDays,createdAt:nowIso()});},{message:`${word.word} 标记为“${ratingLabel}”，下次在 ${formatDate(nextDate)}复习。`});
  }

    const executionEvidence=todos.length?`计划完成 ${todoDone}/${todos.length}（${todoRate}%），运动 ${workoutDays} 天 / ${workoutMinutes} 分钟${moodAvg!==null?`，心情均值 ${moodAvg.toFixed(1)} 分`:''}。`:`本周还没有计划记录；运动 ${workoutDays} 天 / ${workoutMinutes} 分钟${moodAvg!==null?`，心情均值 ${moodAvg.toFixed(1)} 分`:''}。`;
    let executionSuggestion='下周先安排 1 件关键任务，并给它预留一个明确时间段。';
    if(todos.length&&todoRate>=80&&workoutDays<2)executionSuggestion='执行率很高，但活动恢复偏少；建议在高负荷日后固定加入 20 分钟低强度运动。';
    else if(todos.length&&todoRate<60)executionSuggestion='计划量可能超过当前可用精力；把每天关键事项收敛到 1–3 件，再观察完成率。';
    else if(todos.length&&todoRate>=60)executionSuggestion='当前执行节奏可维持；下周不要同步增加任务数量和强度。';
    coach.push({symbol:'计',title:'执行与恢复',evidence:executionEvidence,suggestion:executionSuggestion});
    if(activeMood!==null&&restMood!==null){
      const diff=activeMood-restMood;
      coach.push({symbol:'心',title:'运动与情绪线索',evidence:`有运动记录日的心情均值 ${activeMood.toFixed(1)} 分，无运动记录日 ${restMood.toFixed(1)} 分，相差 ${Math.abs(diff).toFixed(1)} 分。`,suggestion:`这只是本周小样本相关，不代表因果。${diff>=.3?'可以优先复用本周运动日的作息安排。':diff<=-.3?'运动日情绪反而更低，建议检查强度、睡眠或当天工作负荷。':'目前差异很小，继续记录 2–3 周再判断。'}`});
    } else if(lowestMood){
      coach.push({symbol:'心',title:'情绪低点回看',evidence:`${formatFullDate(lowestMood.date)}心情最低，为 ${lowestMood.score.toFixed(1)} 分；当天安排 ${lowDayTodos.length} 项任务、支出 ${money(lowDayExpense)}，${workoutDateSet.has(lowestMood.date)?'有':'没有'}运动记录。`,suggestion:'单日不能证明触发因素；下次低点可同时记录工作量、睡眠或运动标签，帮助形成可比较样本。'});
    } else coach.push({symbol:'心',title:'情绪关联暂不可判定',evidence:'本周没有足够的心情记录，无法比较运动日、任务量与情绪变化。',suggestion:'下周任选 3 天记录心情即可，不需要写长日记。'});
    const topRatio=topCat&&expense?Math.round(catTotals[topCat]/expense*100):0,spendEvidence=ledger.length?`本周支出 ${money(expense)}，其中自我投资 ${money(investment)}（${investmentRatio}%）${topCat?`，${topCat}占 ${topRatio}%`:''}${highSpendDate?`；${formatFullDate(highSpendDate)}单日支出最高，为 ${money(spendByDate[highSpendDate])}${highSpendMood!==undefined?`，当日心情 ${highSpendMood.toFixed(1)} 分`:''}`:''}。`:'本周没有收支记录，暂时无法识别消费结构。';
    coach.push({symbol:'账',title:'消费结构与状态',evidence:spendEvidence,suggestion:topCat&&topRatio>=45?`先检查${topCat}中金额最高的一笔；只调整一个可控项目，比泛化地“少花钱”更可执行。`:'维持记录即可；数据较少时不对消费与情绪做因果推断。'});
    const learningEvidence=`阅读 ${pages} 页${notes?`、新增 ${notes} 条笔记`:''}；英语接触 ${studyWords} 个词，当前待复习 ${due} 个。`;
    let learningSuggestion='把输入目标缩小为每天阅读 5 页，并优先清理到期单词。';
    if(pages>0&&studyWords>0)learningSuggestion='阅读与英语都有实际输入；下周保持当前频率，不必同时提高两项指标。';
    else if(pages>0)learningSuggestion='阅读已启动；英语先安排一个 10 分钟复习窗口，避免新词继续积压。';
    else if(studyWords>0)learningSuggestion='英语已启动；把阅读绑定在已有习惯后，先从 5 页开始。';
    coach.push({symbol:'学',title:'阅读与英语投入',evidence:learningEvidence,suggestion:learningSuggestion});
    const summary=`本地规则综合了 ${todos.length} 项计划、${workouts.length} 次运动、${ledger.length} 笔收支、${moods.length} 条心情、${readingLogs.length} 条阅读进度和 ${study.length} 条英语学习记录。`;
    const coachHtml=`<div class="analysis-toolbar"><div class="analysis-local-note"><strong>AI 深度点评 · 本地规则</strong><br>数据仅在浏览器内计算，没有调用联网模型。</div><button class="btn small secondary" type="button" data-action="analysis-overview">返回数据概览</button></div><div class="analysis-lead">${esc(summary)}</div><div class="coach-grid">${coach.map(x=>`<article class="coach-insight"><span class="coach-insight-symbol" aria-hidden="true">${x.symbol}</span><div><strong>${esc(x.title)}</strong><p><em>${esc(x.evidence)}</em> ${esc(x.suggestion)}</p></div></article>`).join('')}</div><div class="analysis-local-note">提示：点评展示的是数据关联与可执行假设，不是医疗、财务或心理诊断。</div>`;
    const overviewHtml=`<div class="analysis-toolbar"><div class="analysis-local-note">先看本周事实指标，再进入跨模块关联分析。</div><button class="btn small" type="button" data-action="ai-deep-analysis">AI 深度点评</button></div><div class="analysis-lead">${esc(lead)}</div><div class="advice-list">${(advice.slice(0,4).length?advice.slice(0,4):['目前没有需要特别调整的项目，保持真实记录就很好。']).map(x=>`<div class="advice">${esc(x)}</div>`).join('')}</div><div class="analysis-rows">${rows.map(r=>`<div class="analysis-row"><div class="analysis-name">${r[0]}</div><div class="analysis-metric">${r[1]}</div><div class="analysis-note">${r[2]}</div></div>`).join('')}</div>`;
    return {subtitle:`${formatFullDate(dates[0])} 至 ${formatFullDate(dates[6])}`,html:overviewHtml,aiHtml:coachHtml};
  }

  function openAnalysis(view='overview'){
    const report=weeklyAnalysis(),modal=document.getElementById('modal'),opening=modal.hidden;if(opening)lastFocus=document.activeElement;
    document.getElementById('modalTitle').textContent=view==='ai'?'AI 深度点评':'周度数据分析';document.getElementById('modalSubtitle').textContent=report.subtitle;document.getElementById('modalBody').innerHTML=view==='ai'?report.aiHtml:report.html;
    document.getElementById('overlay').hidden=false;modal.hidden=false;document.body.classList.add('modal-open');setBackgroundInert(true);modal.inert=false;if(opening)setTimeout(()=>document.getElementById('modalClose').focus(),30);
  }
  function closeModal(){document.getElementById('overlay').hidden=true;document.getElementById('modal').hidden=true;document.body.classList.remove('modal-open');setBackgroundInert(false);syncSidebarAccessibility();if(lastFocus?.focus)lastFocus.focus();}
  function syncTopbarAction(){
    const btn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar');
    if(!btn||sidebar.classList.contains('open'))return;
    const actions={home:['编辑今日计划','ph-pencil-simple-line'],daily:['添加计划','ph-plus'],ledger:['查看记账图表','ph-chart-bar'],fitness:['添加运动记录','ph-plus'],mood:['添加心情记录','ph-plus'],reading:['管理阅读档案','ph-pencil-simple-line'],travel:['添加习惯或行程','ph-plus'],english:['查看学习统计','ph-chart-bar'],goals:['添加目标','ph-plus']};
    const [label,icon]=actions[activeModule]||['打开导航','ph-list'];
    btn.setAttribute('aria-label',label);
    btn.innerHTML=`<i class="ph ${icon}" aria-hidden="true"></i>`;
  }
  function openSidebar(){const btn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar');sidebar.classList.add('open');sidebar.inert=false;sidebar.setAttribute('aria-hidden','false');document.getElementById('mobileOverlay').hidden=false;btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-label','关闭导航');btn.innerHTML='<i class="ph ph-x" aria-hidden="true"></i>';document.getElementById('mobileMoreBtn').setAttribute('aria-expanded','true');document.body.classList.add('drawer-open');}
  function closeSidebar(){const btn=document.getElementById('menuBtn');document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').hidden=true;btn.setAttribute('aria-expanded','false');document.getElementById('mobileMoreBtn').setAttribute('aria-expanded','false');document.body.classList.remove('drawer-open');syncTopbarAction();syncSidebarAccessibility();}
  function toggleSidebar(){document.getElementById('sidebar').classList.contains('open')?closeSidebar():openSidebar();}

  document.getElementById('analysisBtn').addEventListener('click',()=>{closeSidebar();openAnalysis();});
  document.addEventListener('change',event=>{
    const control=event.target.closest('[data-action]');
    if(!control)return;
    if(control.dataset.action==='ledger-month'){
      ledgerMonth=/^\d{4}-\d{2}$/.test(control.value)?control.value:dateKey().slice(0,7);
      render();
    }
    if(control.dataset.action==='goal-year'){
      goalYear=Number(control.value)||new Date().getFullYear();
      render();
    }
  });
  document.getElementById('skipLink').addEventListener('click',event=>{event.preventDefault();setTimeout(()=>{const app=document.getElementById('app');app.focus({preventScroll:true});app.scrollIntoView({block:'start'});},0);});
  document.getElementById('quickActionBtn').addEventListener('click',()=>{closeSidebar();toggleSmart(true);});
  document.getElementById('exportBtn').addEventListener('click',()=>{closeSidebar();exportData();});
  document.getElementById('importBtn').addEventListener('click',()=>{closeSidebar();document.getElementById('importFile').click();});
  document.getElementById('importFile').addEventListener('change',e=>importData(e.target.files[0]));
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.getElementById('confirmCancel').addEventListener('click',()=>closeConfirm(false));
  document.getElementById('confirmAccept').addEventListener('click',()=>closeConfirm(true));
  document.getElementById('overlay').addEventListener('click',()=>document.getElementById('confirmDialog').hidden?closeModal():closeConfirm(false));
  document.getElementById('smartFab').addEventListener('click',()=>toggleSmart());
  document.getElementById('mobileSmartBtn').addEventListener('click',()=>toggleSmart());
  document.getElementById('smartClose').addEventListener('click',()=>toggleSmart(false));
  document.getElementById('smartSubmit').addEventListener('click',submitSmart);
  document.getElementById('smartInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitSmart();}});
  document.querySelectorAll('[data-example]').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('smartInput').value=btn.dataset.example;document.getElementById('smartInput').focus();}));
  document.getElementById('menuBtn').addEventListener('click',()=>{
    if(document.getElementById('sidebar').classList.contains('open')){closeSidebar();return;}
    if(['home','daily'].includes(activeModule)){openTodoSheet();return;}
    const targets={ledger:'#ledgerChart',fitness:'#fitnessForm',mood:'#moodForm',reading:'#bookLibrary',travel:'#habitForm',english:'#englishChart',goals:'#objectiveForm'};
    if(document.querySelector(targets[activeModule]))openArchiveDetail(targets[activeModule]);
    else openSidebar();
  });
  document.getElementById('mobileMoreBtn').addEventListener('click',openSidebar);
  document.getElementById('mobileOverlay').addEventListener('click',closeSidebar);
  document.getElementById('todoSheetClose').addEventListener('click',()=>closeTodoSheet());
  document.getElementById('todoSheetOverlay').addEventListener('click',()=>closeTodoSheet());
  document.addEventListener('touchstart',handleSmartNavTouchStart,{passive:true});
  document.addEventListener('touchmove',handleSmartNavTouchMove,{passive:true});
  document.addEventListener('touchend',handleSmartNavTouchEnd,{passive:true});
  document.addEventListener('touchcancel',handleSmartNavTouchEnd,{passive:true});
  document.addEventListener('scrollend',restoreSmartNav,{passive:true});
  window.visualViewport?.addEventListener('resize',()=>{updateTodoSheetViewport();updateSmartViewport();},{passive:true});
  window.visualViewport?.addEventListener('scroll',()=>{updateTodoSheetViewport();updateSmartViewport();},{passive:true});
  window.addEventListener('resize',()=>{syncSidebarAccessibility();if(!window.Chart){clearTimeout(window.__lifeResize);window.__lifeResize=setTimeout(initActiveCharts,160);}});

  const now=new Date();
  document.getElementById('sidebarDate').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()]}`;
  syncSidebarAccessibility();
  render();
  </script>
</body>
</html>
