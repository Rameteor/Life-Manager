<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="一个在浏览器本地运行的个人生活管理工作台。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23171b24'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='white' font-family='sans-serif'%3E%E7%94%9F%3C/text%3E%3C/svg%3E">
  <title>人生管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-soft: #fbfbfd;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --muted-2: #8e8e93;
      --border: #e5e5ea;
      --primary: #0071e3;
      --primary-soft: #eaf4ff;
      --green: #34c759;
      --orange: #ff9500;
      --pink: #ff375f;
      --purple: #af52de;
      --cyan: #5ac8fa;
      --indigo: #5856d6;
      --danger: #ff3b30;
      --radius-card: 16px;
      --radius-control: 12px;
      --shadow: 0 10px 32px rgba(28, 39, 49, .07);
      --shadow-float: 0 18px 50px rgba(28, 39, 49, .16);
      --sidebar: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
    body.modal-open, body.drawer-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; }
    button, label, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, .22);
    }
    button:active { transform: scale(.98); }
    [hidden] { display: none !important; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
      width: var(--sidebar);
      padding: 22px 14px 16px;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, .92);
      border-right: 1px solid rgba(0, 0, 0, .06);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
    }

    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 18px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--primary); color: #fff; font-size: 18px; font-weight: 750;
      box-shadow: 0 8px 18px rgba(0, 113, 227, .22);
    }
    .brand strong { display: block; font-size: 16px; letter-spacing: -.3px; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .nav { display: grid; gap: 4px; }
    .nav-btn, .utility-btn {
      width: 100%; min-height: 44px; border-radius: 11px;
      display: flex; align-items: center; gap: 11px;
      padding: 0 12px; background: transparent; color: #424245;
      cursor: pointer; text-align: left; font-size: 14px;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .nav-btn:hover, .utility-btn:hover { background: #f2f2f7; }
    .nav-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 650; }
    .nav-icon {
      width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px;
      display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 750;
      background: var(--icon, var(--primary));
    }
    .sidebar-spacer { flex: 1; min-height: 18px; }
    .sidebar-tools { padding-top: 12px; border-top: 1px solid var(--border); display: grid; gap: 2px; }
    .utility-btn { color: var(--muted); font-size: 13px; }
    .utility-symbol { width: 22px; color: var(--text); font-size: 17px; text-align: center; }

    .main { min-height: 100dvh; margin-left: var(--sidebar); }
    .mobile-topbar { display: none; }
    .content { width: min(100%, 1280px); margin: 0 auto; padding: 30px 32px 80px; }
    .page { animation: page-in .28s cubic-bezier(.2, .75, .25, 1) both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
    .page-title { margin: 0; font-size: clamp(25px, 3vw, 32px); line-height: 1.15; letter-spacing: -.8px; }
    .page-subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .card {
      background: var(--surface); border: 1px solid rgba(0, 0, 0, .045);
      border-radius: var(--radius-card); box-shadow: var(--shadow);
    }
    .card-pad { padding: 20px; }
    .section-title { margin: 0; font-size: 17px; letter-spacing: -.25px; }
    .section-note { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .stack { display: grid; gap: 16px; }
    .grid-main-side { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(285px, .72fr); gap: 20px; }
    .grid-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .grid-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

    .btn {
      min-height: 44px; border-radius: var(--radius-control); padding: 0 16px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: var(--primary); color: #fff; cursor: pointer; font-weight: 650; font-size: 14px;
      white-space: nowrap; transition: filter .18s ease, transform .18s ease, background .18s ease;
    }
    .btn:hover { filter: brightness(.96); }
    .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost { min-height: 36px; padding: 0 10px; background: transparent; color: var(--muted); }
    .btn.danger { background: #fff0f0; color: #c9342e; }
    .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .field { display: grid; gap: 7px; min-width: 0; }
    .field label, .field-label { color: #424245; font-size: 13px; font-weight: 600; }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 0 12px;
      border: 1px solid #d2d2d7; border-radius: var(--radius-control);
      background: #fff; color: var(--text); transition: border-color .18s ease, box-shadow .18s ease;
    }
    .textarea { min-height: 88px; padding-block: 11px; resize: vertical; line-height: 1.5; }
    .input::placeholder, .textarea::placeholder { color: #86868b; opacity: 1; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); outline: 0; }
    .form-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-8 { grid-column: span 8; }
    .span-12 { grid-column: 1 / -1; }
    .field-error { min-height: 16px; color: #c9342e; font-size: 12px; }

    .summary-strip {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
      padding: 18px 8px; margin-bottom: 20px;
    }
    .metric { min-width: 0; padding: 2px 18px; }
    .metric + .metric { border-left: 1px solid var(--border); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 7px; font-size: clamp(23px, 3vw, 30px); font-weight: 720; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
    .metric-note { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .money-income { color: #248a3d; } .money-expense { color: var(--pink); }

    .quick-form { padding: 16px; margin-bottom: 14px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 14px; }
    .segmented { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: #ececf0; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label { min-width: 54px; min-height: 36px; padding: 0 12px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 13px; }
    .segmented input:checked + label { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); font-weight: 650; }
    .segmented input:focus-visible + label, .choice input:focus-visible + label, .mood-option input:focus-visible + label, .todo-sheet-priorities input:focus-visible + label { outline: 2px solid var(--primary); outline-offset: 2px; }
    .segmented button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); font-weight: 650; }

    .list { display: grid; }
    .list-row { min-height: 62px; display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
    .list-row:last-child { border-bottom: 0; }
    .row-main { min-width: 0; flex: 1; }
    .row-title { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
    .row-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .row-actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      background: transparent; color: var(--muted); cursor: pointer; font-size: 17px;
    }
    .icon-btn:hover { background: #f2f2f7; color: var(--text); }
    .check {
      appearance: none; width: 22px; height: 22px; flex: 0 0 22px;
      border: 2px solid #c7c7cc; border-radius: 7px; background: #fff; cursor: pointer;
      display: grid; place-content: center;
    }
    .check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 800; transform: scale(0); transition: transform .14s ease; }
    .check:checked { background: var(--primary); border-color: var(--primary); }
    .check:checked::after { transform: scale(1); }
    .completed .row-title { color: var(--muted-2); text-decoration: line-through; }

    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 650; }
    .badge-high { color: #c9342e; background: #fff0f0; }
    .badge-medium { color: #a55c00; background: #fff5e6; }
    .badge-low { color: #26783a; background: #ebf9ee; }

    .progress-ring { width: 148px; height: 148px; margin: 8px auto 16px; position: relative; display: grid; place-items: center; }
    .progress-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: #ececf0; stroke-width: 10; }
    .ring-value { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
    .ring-copy { position: absolute; text-align: center; }
    .ring-copy strong { display: block; font-size: 30px; letter-spacing: -1px; }
    .ring-copy small { color: var(--muted); font-size: 12px; }
    .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini-stat { padding: 11px 8px; border-radius: 12px; background: var(--surface-soft); text-align: center; }
    .mini-stat strong { display: block; font-size: 18px; }
    .mini-stat span { color: var(--muted); font-size: 11px; }

    .empty { padding: 42px 16px; text-align: center; color: var(--muted); }
    .empty-symbol { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 15px; display: grid; place-items: center; background: #f2f2f7; color: var(--primary); font-size: 22px; font-weight: 700; }
    .empty strong { display: block; color: var(--text); font-size: 14px; }
    .empty p { margin: 6px auto 0; max-width: 320px; font-size: 13px; line-height: 1.5; }

    .chart-wrap { position: relative; width: 100%; height: 250px; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }
    .chart-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; background: linear-gradient(180deg, transparent, rgba(245,245,247,.4)); border-radius: 12px; }
    .legend { display: grid; gap: 8px; margin-top: 12px; }
    .legend-row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

    .choice-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .choice input { position: absolute; opacity: 0; }
    .choice label { min-height: 52px; padding: 6px; border: 1px solid var(--border); border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: #424245; font-size: 13px; text-align: center; }
    .choice input:checked + label { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); font-weight: 650; }

    .heat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .heat-day { min-width: 0; padding: 10px 4px; border-radius: 12px; text-align: center; background: #f2f2f7; }
    .heat-day span { display: block; font-size: 11px; color: var(--muted); }
    .heat-day strong { display: block; margin: 5px 0; font-size: 15px; }
    .heat-day small { display: block; color: var(--muted); font-size: 10px; }
    .heat-1 { background: #fff2df; } .heat-2 { background: #ffdca9; } .heat-3 { background: #ffbd63; color: #633400; }
    .streak { display: flex; align-items: flex-end; gap: 8px; }
    .streak strong { font-size: 48px; line-height: .9; letter-spacing: -2px; color: var(--orange); }
    .streak span { padding-bottom: 3px; color: var(--muted); font-size: 14px; }

    .mood-picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .mood-option input { position: absolute; opacity: 0; }
    .mood-option label { min-height: 58px; border: 1px solid transparent; border-radius: 14px; display: grid; place-items: center; cursor: pointer; font-size: 28px; background: #f6f6f8; }
    .mood-option input:checked + label { border-color: var(--primary); background: #fff1f4; box-shadow: 0 0 0 2px rgba(0,113,227,.1); }

    .book-card { padding: 20px; }
    .book-title { margin: 0; font-size: 18px; letter-spacing: -.25px; }
    .book-author { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .book-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .progress { height: 7px; margin: 17px 0 9px; overflow: hidden; border-radius: 999px; background: #ececf0; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--purple); transition: width .35s ease; }
    .progress-copy { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .inline-form { display: flex; gap: 8px; margin-top: 14px; }
    .inline-form .input { min-width: 0; }
    details.notes { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    details.notes summary { cursor: pointer; color: var(--purple); font-size: 13px; font-weight: 650; }
    .note-item { padding: 10px 0; border-bottom: 1px solid var(--border); color: #424245; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }

    .trip-header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .trip-destination { margin: 0; font-size: 23px; letter-spacing: -.5px; }
    .trip-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; }
    .trip-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; }
    .trip-tab { min-height: 38px; padding: 0 13px; border-radius: 999px; background: #fff; border: 1px solid var(--border); color: var(--muted); cursor: pointer; white-space: nowrap; }
    .trip-tab.active { color: var(--primary); border-color: #acd4ff; background: var(--primary-soft); font-weight: 650; }
    .timeline { position: relative; display: grid; gap: 4px; }
    .timeline-item { display: grid; grid-template-columns: 70px 20px 1fr auto; align-items: center; gap: 10px; min-height: 56px; }
    .timeline-time { color: var(--muted); font-size: 12px; text-align: right; }
    .timeline-node { width: 10px; height: 10px; margin: auto; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px #e9f9ff; }
    .timeline-item.done .row-title { text-decoration: line-through; color: var(--muted); }
    .packing-list { display: grid; gap: 3px; }
    .packing-item { min-height: 44px; display: flex; align-items: center; gap: 9px; }

    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .word-card { position: relative; height: 176px; perspective: 800px; background: transparent; border-radius: var(--radius-card); }
    .word-flip { width: 100%; height: 100%; padding: 0; perspective: 800px; background: transparent; cursor: pointer; border-radius: var(--radius-card); text-align: left; }
    .word-card-inner { position: relative; width: 100%; height: 100%; transition: transform .28s ease; transform-style: preserve-3d; }
    .word-flip.flipped .word-card-inner { transform: rotateY(180deg); }
    .word-face { position: absolute; inset: 0; padding: 19px; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border: 1px solid rgba(0,0,0,.05); border-radius: var(--radius-card); box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .word-back { transform: rotateY(180deg); background: #f2f1ff; }
    .word-name { margin: auto 0 0; font-size: 25px; font-weight: 720; letter-spacing: -.5px; color: var(--indigo); }
    .phonetic { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .meaning { margin: auto 0; font-size: 18px; font-weight: 650; line-height: 1.45; }
    .word-hint { color: var(--muted); font-size: 11px; }
    .word-delete { position: absolute; right: 9px; bottom: 8px; z-index: 2; }

    .fab { position: fixed; right: 24px; bottom: 24px; z-index: 30; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; box-shadow: 0 14px 32px rgba(0,113,227,.32); cursor: pointer; font-size: 26px; }
    .smart-panel { position: fixed; right: 24px; bottom: 94px; z-index: 30; width: min(380px, calc(100vw - 32px)); max-height: 500px; overflow: auto; padding: 18px; background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.06); border-radius: 20px; box-shadow: var(--shadow-float); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); transform-origin: bottom right; animation: smart-in .2s ease both; }
    @keyframes smart-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
    .smart-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .smart-head strong { flex: 1; font-size: 16px; }
    .smart-examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
    .smart-example { min-height: 30px; padding: 0 10px; border-radius: 999px; background: #f2f2f7; color: var(--muted); cursor: pointer; font-size: 12px; }
    .smart-result { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); color: #165f9f; font-size: 12px; line-height: 1.5; }

    .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(20,20,25,.32); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade-in .18s ease; }
    @keyframes fade-in { from { opacity: 0; } }
    .modal { position: fixed; z-index: 50; left: 50%; top: 50%; width: min(920px, calc(100vw - 32px)); max-height: 86dvh; overflow: auto; transform: translate(-50%, -50%); background: var(--bg); border-radius: 22px; box-shadow: 0 24px 80px rgba(0,0,0,.22); animation: modal-in .22s cubic-bezier(.2,.75,.25,1); }
    @keyframes modal-in { from { opacity: 0; transform: translate(-50%, -47%) scale(.985); } }
    .modal-head { position: sticky; top: 0; z-index: 1; padding: 20px 22px; display: flex; align-items: center; gap: 14px; background: rgba(245,245,247,.94); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); }
    .modal-head > div { flex: 1; }
    .modal-head h2 { margin: 0; font-size: 21px; }
    .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 22px; }
    .analysis-lead { padding: 18px; margin-bottom: 14px; border-radius: 16px; background: #eaf4ff; color: #15598f; line-height: 1.55; }
    .advice-list { display: grid; gap: 8px; margin-bottom: 18px; }
    .advice { padding: 12px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
    .analysis-rows { display: grid; background: #fff; border-radius: 16px; padding: 0 18px; box-shadow: var(--shadow); }
    .analysis-row { display: grid; grid-template-columns: 120px 1fr 1.4fr; gap: 18px; align-items: center; min-height: 72px; border-bottom: 1px solid var(--border); }
    .analysis-row:last-child { border: 0; }
    .analysis-name { font-weight: 650; }
    .analysis-metric { color: var(--text); font-size: 13px; }
    .analysis-note { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .toast-region { position: fixed; z-index: 60; right: 24px; top: 20px; display: grid; gap: 8px; pointer-events: none; }

      }
      @keyframes todo-sheet-in { from { opacity: 0; transform: translateY(36px); } }
      .todo-sheet-handle { width: 38px; height: 4px; margin: 0 auto 16px; border-radius: 999px; background: #c7cad1; }

      .fab { display: none; }
      .smart-panel { left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); width: auto; max-height: min(66dvh, 500px); transform-origin: bottom center; }
      .toast-region { top: 70px; right: 12px; left: 12px; }
      .toast { min-width: 0; max-width: none; }

    /* 2026 visual refresh: a calm personal operating system */
    :root {
      --bg: #f1f4f8;
      --surface: rgba(255, 255, 255, .86);
      --surface-soft: #f5f7fa;
      --text: #17181b;
      --muted: #6b7080;
      --muted-2: #9297a3;
      --border: rgba(31, 39, 56, .08);
      --radius-card: 24px;
      --radius-control: 13px;
      --shadow: 0 18px 50px rgba(63, 76, 103, .09), 0 2px 8px rgba(63, 76, 103, .04);
      --shadow-float: 0 28px 80px rgba(39, 50, 72, .22), 0 4px 16px rgba(39, 50, 72, .08);
    }

    body {
      position: relative;
      isolation: isolate;
      background: #f1f4f8;
      --ambient: rgba(0, 113, 227, .12);
    }
    body[data-active-module="ledger"] { --ambient: rgba(52, 199, 89, .12); }
    body[data-active-module="fitness"] { --ambient: rgba(255, 149, 0, .13); }
    body[data-active-module="mood"] { --ambient: rgba(255, 55, 95, .11); }
    body[data-active-module="reading"] { --ambient: rgba(175, 82, 222, .12); }
    body[data-active-module="travel"] { --ambient: rgba(90, 200, 250, .16); }
    body[data-active-module="english"] { --ambient: rgba(88, 86, 214, .12); }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(900px 620px at 86% -12%, var(--ambient), transparent 67%),
        radial-gradient(720px 520px at 4% 104%, rgba(0, 113, 227, .055), transparent 68%),
        #f1f4f8;
      transition: background .5s ease;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .38;
      background-image: radial-gradient(rgba(44, 55, 76, .12) .55px, transparent .7px);
      background-size: 17px 17px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 52%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 52%);
    }

    .color-plan { --module: #0071e3; --module-soft: #e7f2ff; --module-action: #0068d1; }
    .color-ledger { --module: #34c759; --module-soft: #e9f9ed; --module-action: #248a3d; }
    .color-fitness { --module: #ff9500; --module-soft: #fff2de; --module-action: #b65d00; }
    .color-mood { --module: #ff375f; --module-soft: #ffecf1; --module-action: #d4264b; }
    .color-reading { --module: #af52de; --module-soft: #f7eafd; --module-action: #8f3db7; }
    .color-travel { --module: #5ac8fa; --module-soft: #e6f8ff; --module-action: #087fae; }
    .color-english { --module: #5856d6; --module-soft: #efefff; --module-action: #4b49bd; }

    .sidebar {
      inset: 14px auto 14px 14px;
      height: auto;
      padding: 18px 12px 14px;

      border-radius: 28px;

    .grid-main-side > aside.card,
    .grid-two > .card:nth-child(2) {

    .page .btn:not(.secondary):not(.ghost):not(.danger) {

    }
    .btn { min-height: 46px; border-radius: 13px; letter-spacing: -.1px; }

    .input, .select, .textarea {

    }
    .input:hover, .select:hover, .textarea:hover { background: #f0f3f7; }
    .input:focus, .select:focus, .textarea:focus {

<body>
  <aside class="sidebar" id="sidebar" aria-label="主要导航">

  <script>
  'use strict';

  const STORAGE_KEY = 'lifeWorkbench.v1';
  const BACKUP_KEY = 'lifeWorkbench.backup';
  const APP_VERSION = 2;
  const CATEGORIES = ['餐饮','交通','购物','娱乐','住房','医疗','教育','工资','理财','通讯','人情','其他'];
  const SPORTS = ['跑步','游泳','健身','骑行','瑜伽','篮球','跳绳','散步'];
  const GOAL_LEVELS = {long:'长期目标',quarter:'季度目标',month:'月度目标'};
  const GOAL_STATUSES = {active:'进行中',paused:'已暂停',completed:'已完成'};
  const MOODS = [
    {emoji:'😄', score:6, label:'开心'}, {emoji:'😊', score:5, label:'愉快'},
    {emoji:'😐', score:4, label:'平静'}, {emoji:'😔', score:3, label:'低落'},
    {emoji:'😤', score:2, label:'烦躁'}, {emoji:'😢', score:1, label:'难过'}
  ];
  const MODULES = [
    {id:'home', label:'人生看板', short:'生', color:'#171b24'},
    {id:'goals', label:'目标管理', short:'目', color:'#0a84ff'},
    {id:'daily', label:'每日计划', short:'计', color:'#0071e3'},
    {id:'ledger', label:'记账本', short:'账', color:'#34c759'},
    {id:'fitness', label:'运动打卡', short:'动', color:'#ff9500'},
    {id:'mood', label:'心情日记', short:'心', color:'#ff375f'},
    {id:'reading', label:'读书收获', short:'读', color:'#af52de'},
    {id:'travel', label:'习惯与行程', short:'行', color:'#5ac8fa'},
    {id:'english', label:'英语学习', short:'词', color:'#5856d6'}
  ];
  const WEEK_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
  const chartInstances = new Map();
  let chartFrame = 0;
  let activeModule = localStorage.getItem('lifeWorkbench.active') || 'home';
  let moodRange = localStorage.getItem('lifeWorkbench.moodRange') === 'month' ? 'month' : 'week';
  let activeTripId = '';
  let lastFocus = null;
  let lastSnapshot = null;

  const defaultState = () => ({
    schemaVersion: APP_VERSION,
    meta: { createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
    settings: { dailyWordGoal: 10, monthlyBudget: 0 },
    goals: { items: [] },
    habits: { items: [] },
    daily: { todos: [] }, ledger: { entries: [] }, fitness: { workouts: [] },
    mood: { entries: [] }, reading: { books: [], progressLogs: [] },
    travel: { trips: [] }, english: { words: [], studyLogs: [] }
  });

  const pad = n => String(n).padStart(2, '0');
  const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseDay = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d, 12); };
  const shiftDay = (s,n) => { const d = parseDay(s); d.setDate(d.getDate()+n); return dateKey(d); };
  const mondayOf = s => shiftDay(s, -((parseDay(s).getDay()+6)%7));
  const weekDates = (base=dateKey()) => Array.from({length:7}, (_,i)=>shiftDay(mondayOf(base),i));
  const monthDates = (base=dateKey()) => { const d=parseDay(base),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),prefix=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;return Array.from({length:count},(_,i)=>`${prefix}-${pad(i+1)}`); };
  const inThisWeek = s => weekDates().includes(s);
  let idSequence = 0;
  const id = () => {
    if(typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    idSequence += 1;
    return `${Date.now().toString(36)}-${idSequence.toString(36)}-${Math.random().toString(36).slice(2)}`;
  };
  const safeId = value => /^[A-Za-z0-9_-]{1,100}$/.test(String(value||'')) ? String(value) : id();
  const claimId = (seen,value) => { let next=safeId(value); while(seen.has(next)) next=id(); seen.add(next); return next; };
  const removeOneById = (items,itemId) => { const index=items.findIndex(x=>x.id===itemId); if(index>=0) items.splice(index,1); };
  const nowIso = () => new Date().toISOString();
  const clamp = (n,min,max) => Math.min(max,Math.max(min,n));
  const money = n => new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:2}).format(Number(n)||0);
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const formatDate = s => { if(!s) return ''; const d=parseDay(s); return `${d.getMonth()+1}月${d.getDate()}日`; };
  const formatFullDate = s => { const d=parseDay(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; };
  const daysBetween = (a,b) => Math.round((parseDay(b)-parseDay(a))/86400000);

  function loadState(){
    try {
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      return normalizeState(JSON.parse(raw));
    } catch(err) {
      try { const raw=localStorage.getItem(STORAGE_KEY); if(raw) localStorage.setItem(`${STORAGE_KEY}.corrupt.${Date.now()}`,raw); } catch(_) {}
      setTimeout(()=>toast('本地数据损坏，已安全恢复为空白数据。'),100);
      return defaultState();
    }
  }

  function migrateState(source){
    const version=Number(source?.schemaVersion||1);if(version>=2)return source;
    return {...source,schemaVersion:2,settings:{...(source.settings||{}),monthlyBudget:Number(source.settings?.monthlyBudget)||0},goals:source.goals||{items:[]},habits:source.habits||{items:[]}};
  }

  function normalizeState(raw){
    if(!raw || typeof raw!=='object') throw new Error('备份不是有效对象');
    if(raw.data && raw.app !== 'life-workbench') throw new Error('这不是人生管理系统的备份文件');
    const source = raw.data && raw.app === 'life-workbench' ? raw.data : raw;
    const src=migrateState(source);
    if(Number(src.schemaVersion||1)>APP_VERSION) throw new Error('备份版本高于当前应用');
    const next=defaultState();
    next.meta = {...next.meta, ...(src.meta||{})};
    next.settings.dailyWordGoal = clamp(Number(src.settings?.dailyWordGoal)||10,1,200);
    next.settings.monthlyBudget = clamp(Number(src.settings?.monthlyBudget)||0,0,1e9);
    const goalIds=new Set();
    next.goals.items = Array.isArray(src.goals?.items) ? src.goals.items.filter(x=>x&&x.title).map(x=>{
      const progress=clamp(Math.round(Number(x.progress)||0),0,100);
      let status=Object.hasOwn(GOAL_STATUSES,x.status)?x.status:'active';
      if(progress>=100)status='completed';
      return {...x,id:claimId(goalIds,x.id),title:String(x.title).slice(0,200),level:Object.hasOwn(GOAL_LEVELS,x.level)?x.level:'long',parentId:typeof x.parentId==='string'?x.parentId:null,deadline:validDate(x.deadline)?x.deadline:dateKey(),progress:status==='completed'?100:progress,status,createdAt:x.createdAt||nowIso(),updatedAt:x.updatedAt||x.createdAt||nowIso()};
    }) : [];
    next.goals.items.forEach(x=>{if(!next.goals.items.some(parent=>parent.id===x.parentId&&parent.id!==x.id))x.parentId=null;});
    const habitIds=new Set();
    next.habits.items = Array.isArray(src.habits?.items) ? src.habits.items.filter(x=>x&&x.name).map(x=>({
      ...x,id:claimId(habitIds,x.id),name:String(x.name).slice(0,80),dates:Array.isArray(x.dates)?[...new Set(x.dates.filter(validDate))].slice(-730):[],createdAt:x.createdAt||nowIso()
    })) : [];
    const todoIds=new Set();
    next.daily.todos = Array.isArray(src.daily?.todos) ? src.daily.todos.filter(x=>x&&x.text).map(x=>({...x,id:claimId(todoIds,x.id),text:String(x.text).slice(0,200),priority:['high','medium','low'].includes(x.priority)?x.priority:'medium',date:validDate(x.date)?x.date:dateKey(),done:Boolean(x.done)})) : [];
    const ledgerIds=new Set();
    next.ledger.entries = Array.isArray(src.ledger?.entries) ? src.ledger.entries.filter(x=>x&&Number(x.amount)>0&&validDate(x.date)).map(x=>({...x,id:claimId(ledgerIds,x.id),type:x.type==='income'?'income':'expense',amount:clamp(Number(x.amount),.01,1e9),category:CATEGORIES.includes(x.category)?x.category:'其他',note:String(x.note||'').slice(0,200)})) : [];
    const workoutIds=new Set();
    next.fitness.workouts = Array.isArray(src.fitness?.workouts) ? src.fitness.workouts.filter(x=>x&&SPORTS.includes(x.type)&&validDate(x.date)).map(x=>({...x,id:claimId(workoutIds,x.id),minutes:clamp(Math.round(Number(x.minutes)||0),1,1440),calories:clamp(Math.round(Number(x.calories)||0),0,100000),note:String(x.note||'').slice(0,200)})) : [];
    const moodIds=new Set();
    next.mood.entries = Array.isArray(src.mood?.entries) ? src.mood.entries.filter(x=>x&&validDate(x.date)).map(x=>{const score=clamp(Number(x.score)||4,1,6);return {...x,id:claimId(moodIds,x.id),score,emoji:MOODS.find(m=>m.score===score).emoji,text:String(x.text||'').slice(0,5000)};}) : [];
    const readingBookIds=new Set();
    next.reading.books = Array.isArray(src.reading?.books) ? src.reading.books.filter(x=>x&&x.title&&Number(x.totalPages)>0).map(x=>{ const total=clamp(Math.round(Number(x.totalPages)),1,100000),noteIds=new Set(),currentPage=clamp(Math.round(Number(x.currentPage)||0),0,total); return {...x,id:claimId(readingBookIds,x.id),title:String(x.title).slice(0,200),author:String(x.author||'').slice(0,200),status:['wishlist','reading','finished'].includes(x.status)?x.status:(currentPage>=total?'finished':'reading'),totalPages:total,currentPage,notes:Array.isArray(x.notes)?x.notes.filter(n=>n&&n.text).map(n=>({...n,id:claimId(noteIds,n.id),kind:n.kind==='highlight'?'highlight':'note',text:String(n.text).slice(0,5000),page:clamp(Math.round(Number(n.page)||0),0,total),date:validDate(n.date)?n.date:dateKey()})):[]}; }) : [];
    const bookIds=new Set(next.reading.books.map(x=>x.id));
    const progressIds=new Set();
    next.reading.progressLogs=Array.isArray(src.reading?.progressLogs)?src.reading.progressLogs.filter(x=>x&&bookIds.has(x.bookId)&&validDate(x.date)).map(x=>({...x,id:claimId(progressIds,x.id),fromPage:Math.max(0,Math.round(Number(x.fromPage)||0)),toPage:Math.max(0,Math.round(Number(x.toPage)||0)),delta:Math.max(0,Math.round(Number(x.delta)||0))})):[];
    const tripIds=new Set();
    next.travel.trips=Array.isArray(src.travel?.trips)?src.travel.trips.filter(x=>x&&x.destination&&validDate(x.startDate)&&validDate(x.endDate)&&x.endDate>=x.startDate).map(x=>{const itineraryIds=new Set(),packingIds=new Set();return {...x,id:claimId(tripIds,x.id),destination:String(x.destination).slice(0,200),itinerary:Array.isArray(x.itinerary)?x.itinerary.map(i=>({...i,id:claimId(itineraryIds,i.id),title:String(i.title||'').slice(0,200),done:Boolean(i.done)})).filter(i=>i.title):[],packing:Array.isArray(x.packing)?x.packing.map(i=>({...i,id:claimId(packingIds,i.id),text:String(i.text||'').slice(0,200),done:Boolean(i.done)})).filter(i=>i.text):[]};}):[];
    const englishWordIds=new Set();
    next.english.words=Array.isArray(src.english?.words)?src.english.words.filter(x=>x&&x.word&&x.meaning).map(x=>({...x,id:claimId(englishWordIds,x.id),word:String(x.word).slice(0,100),phonetic:String(x.phonetic||'').slice(0,100),meaning:String(x.meaning).slice(0,500),reviewCount:Math.max(0,Math.round(Number(x.reviewCount)||0)),mastered:Boolean(x.mastered),nextReviewDate:validDate(x.nextReviewDate)?x.nextReviewDate:dateKey()})):[];
    const wordIds=new Set(next.english.words.map(x=>x.id));
    const studyIds=new Set();
    next.english.studyLogs=Array.isArray(src.english?.studyLogs)?src.english.studyLogs.filter(x=>x&&wordIds.has(x.wordId)&&validDate(x.date)).map(x=>({...x,id:claimId(studyIds,x.id)})):[];
    return next;
  }

  function validDate(s){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false;
    const [y,m,d]=s.split('-').map(Number); const test=new Date(y,m-1,d);
    return test.getFullYear()===y&&test.getMonth()===m-1&&test.getDate()===d;
  }

  let state=loadState();

  function persist(){
    state.meta.updatedAt=nowIso();
    try { localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); return true; }
    catch(err){ toast('保存失败：浏览器存储空间不可用。'); return false; }
  }

  function mutate(fn,{message='',undo=true}={}){
    const rollback=JSON.stringify(state),snapshot=undo?rollback:null;
    try { fn(state); }
    catch(err){ state=JSON.parse(rollback);toast('操作失败，请重试。');return false; }
    if(!persist()){ state=JSON.parse(rollback);render();return false; }
    render();
    if(message){
      if(snapshot){ lastSnapshot=snapshot; toast(message,{undo:true}); }
      else toast(message);
    }
    return true;
  }

  function undoLast(){
    if(!lastSnapshot) return;
    try { const current=JSON.stringify(state),previous=normalizeState(JSON.parse(lastSnapshot));state=previous;if(!persist()){state=JSON.parse(current);render();return;}lastSnapshot=null;render();toast('已撤销上一步操作。'); }
    catch(_) { toast('无法撤销这次操作。'); }
  }

  function toast(message,{undo=false}={}){
    const el=document.createElement('div'); el.className='toast';
    const span=document.createElement('span'); span.textContent=message; el.appendChild(span);
    if(undo){ const btn=document.createElement('button'); btn.textContent='撤销'; btn.addEventListener('click',()=>{undoLast();el.remove();}); el.appendChild(btn); }
    document.getElementById('toastRegion').appendChild(el);
    setTimeout(()=>el.remove(),4200);
  }

  function emptyState(symbol,title,copy){ return `<div class="empty"><div class="empty-symbol">${esc(symbol)}</div><strong>${esc(title)}</strong><p>${esc(copy)}</p></div>`; }

  function pageHead(title,subtitle,action=''){
    const current=MODULES.find(x=>x.id===activeModule)||MODULES[0],d=parseDay(dateKey()),weekday=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    return `<div class="page-head"><div class="page-identity"><div class="page-glyph" aria-hidden="true">${current.short}</div><div><h1 class="page-title">${esc(title)}</h1><p class="page-subtitle">${esc(subtitle)}</p></div></div><div class="page-actions">${action||`<div class="today-chip"><span>今天</span><strong>${weekday} ${pad(d.getMonth()+1)}.${pad(d.getDate())}</strong></div>`}</div></div>`;
  }

  function destroyCharts(){ chartInstances.forEach(c=>{try{c.destroy();}catch(_){}}); chartInstances.clear(); }

  function budgetStatus(){
    const month=dateKey().slice(0,7),limit=Number(state.settings.monthlyBudget)||0;
    const spent=state.ledger.entries.filter(x=>x.type==='expense'&&x.date.startsWith(month)).reduce((sum,x)=>sum+x.amount,0);
    return {limit,spent,remaining:limit-spent,ratio:limit?spent/limit:0};
  }

  function recentActivities(limit=6){
    const items=[];
    state.daily.todos.filter(x=>x.done&&x.completedAt).forEach(x=>items.push({module:'daily',icon:'计',summary:`完成计划：${x.text}`,date:x.date,createdAt:x.completedAt}));
    state.fitness.workouts.forEach(x=>items.push({module:'fitness',icon:'动',summary:`${x.type} ${x.minutes} 分钟`,date:x.date,createdAt:x.createdAt||x.date}));
    state.reading.progressLogs.filter(x=>Number(x.delta)>0).forEach(x=>{const book=state.reading.books.find(b=>b.id===x.bookId);items.push({module:'reading',icon:'读',summary:`《${book?.title||'一本书'}》阅读 ${Math.round(Number(x.delta))} 页`,date:x.date,createdAt:x.createdAt||x.date});});
    state.english.studyLogs.forEach(x=>items.push({module:'english',icon:'词',summary:x.action==='review'?'完成一次单词复习':'学习了一个新单词',date:x.date,createdAt:x.createdAt||x.date}));
    return items.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,limit);
  }

  function renderActivityList(limit=6){
    const items=recentActivities(limit);
    return items.length?items.map(x=>`<button class="list-row activity-row" type="button" data-module="${x.module}"><span class="nav-icon" style="--icon:#687384">${x.icon}</span><span class="activity-copy"><span class="activity-title">${esc(x.summary)}</span><time class="activity-date" datetime="${x.date}">${formatFullDate(x.date)}</time></span><span class="activity-arrow" aria-hidden="true">›</span></button>`).join(''):emptyState('⌁','还没有生活动态','完成待办、运动或阅读后，相关动态会自动汇总在这里。');
  }

  function renderHome(){
    const today=dateKey();
    const todos=state.daily.todos.filter(x=>x.date===today),todoDone=todos.filter(x=>x.done).length,pending=todos.length-todoDone;
    const {limit:budget,spent:expense,remaining,ratio:budgetRatio}=budgetStatus();
    const latestMood=[...state.mood.entries].sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0];
    const currentBook=[...state.reading.books].filter(x=>x.status==='reading'&&x.currentPage<x.totalPages).sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')))[0];
    const dueWords=state.english.words.filter(x=>!x.mastered&&x.nextReviewDate<=today).length;
    const moodLabel=latestMood?MOODS.find(x=>x.score===latestMood.score)?.label:'';
    const bookProgress=currentBook?Math.round(currentBook.currentPage/currentBook.totalPages*100):0;
    const streakDays=workoutStreak(),workedOutToday=state.fitness.workouts.some(x=>x.date===today);
    const stateRank={attention:0,populated:1,empty:2};
    const dashboardCards=[
      {key:'todos',state:pending?'attention':'empty',priority:0,markup:`<article class="card card-pad home-metric-card" data-dashboard-card="todos" data-card-state="${pending?'attention':'empty'}"><div class="section-head home-card-header"><div class="home-card-heading"><h2 class="section-title">今日待办</h2><p class="section-note">${todos.length?`${todoDone}/${todos.length} 项已完成`:'今天还没有安排'}</p></div><span class="nav-icon home-card-symbol" style="--icon:#0071e3">计</span></div><div class="home-card-body"><div class="metric-value home-card-primary">${pending} <small style="font-size:13px;color:var(--muted)">项</small></div></div><div class="home-card-actions"><button class="btn small secondary" type="button" data-module="daily"><span class="home-action-full">查看今日计划</span><span class="home-action-short">计划</span></button></div></article>`},
      {key:'budget',state:!budget?'empty':budgetRatio>=.8?'attention':'populated',priority:2,markup:`<article class="card card-pad home-metric-card" data-dashboard-card="budget" data-card-state="${!budget?'empty':budgetRatio>=.8?'attention':'populated'}"><div class="section-head home-card-header"><div class="home-card-heading"><h2 class="section-title">每月预算</h2><p class="section-note">已支出 ${money(expense)}${budget?` · ${Math.round(budgetRatio*100)}%`:''}</p></div><span class="nav-icon home-card-symbol" style="--icon:#34c759">账</span></div><div class="home-card-body"><div class="metric-value home-card-primary ${budget&&remaining<0?'money-expense':''}">${budget?money(remaining):'未设置'}</div><div class="metric-note home-card-detail">${budget?(remaining>=0?'预算剩余':'已超出预算，计划页会同步提醒'):'可先设置每月预算'}</div></div><div class="home-card-actions inline-form"><button class="btn small secondary" type="button" data-module="ledger"><span class="home-action-full">查看账本</span><span class="home-action-short">设置</span></button><form class="inline-form" id="budgetForm" style="margin-top:0;flex:1"><input class="input" name="budget" type="number" min="0" max="1000000000" step="0.01" value="${budget||''}" aria-label="每月预算" placeholder="设置预算"><button class="btn small" type="submit">保存</button></form></div></article>`},
      {key:'mood',state:latestMood?'populated':'empty',priority:3,markup:`<article class="card card-pad home-metric-card" data-dashboard-card="mood" data-card-state="${latestMood?'populated':'empty'}"><div class="section-head home-card-header"><div class="home-card-heading"><h2 class="section-title">最近心情</h2><p class="section-note">${latestMood?formatFullDate(latestMood.date):'等待第一次记录'}</p></div>${latestMood?`<span class="home-card-symbol" style="font-size:31px" aria-hidden="true">${latestMood.emoji}</span>`:'<span class="nav-icon home-card-symbol" style="--icon:#ff375f">心</span>'}</div><div class="home-card-body"><div class="metric-value home-card-primary">${latestMood?`${latestMood.score} 分`:'暂无'}</div><div class="metric-note home-card-detail">${latestMood?esc(moodLabel||'已记录'):'记录一下此刻的感受'}</div></div><div class="home-card-actions"><button class="btn small secondary" type="button" data-module="mood"><span class="home-action-full">记录心情</span><span class="home-action-short">记录</span></button></div></article>`},
      {key:'reading',state:currentBook?'populated':'empty',priority:4,markup:`<article class="card card-pad home-metric-card" data-dashboard-card="reading" data-card-state="${currentBook?'populated':'empty'}"><div class="section-head home-card-header"><div class="home-card-heading"><h2 class="section-title">正在阅读</h2><p class="section-note">${currentBook?esc(currentBook.author||'未填写作者'):'书架里暂无在读书籍'}</p></div><span class="nav-icon home-card-symbol" style="--icon:#af52de">读</span></div><div class="home-card-body"><div class="row-title home-card-primary" style="font-size:20px;font-weight:700">${currentBook?esc(currentBook.title):'暂无'}</div>${currentBook?`<div class="progress" role="progressbar" aria-valuenow="${bookProgress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${bookProgress}%"></span></div><div class="progress-copy home-card-detail"><span>第 ${currentBook.currentPage} / ${currentBook.totalPages} 页</span><strong>${bookProgress}%</strong></div>`:'<div class="metric-note home-card-detail" style="margin-top:10px">添加书籍后会在这里显示进度</div>'}</div><div class="home-card-actions"><button class="btn small secondary" type="button" data-module="reading"><span class="home-action-full">打开书架</span><span class="home-action-short">书架</span></button></div></article>`},
      {key:'fitness',state:workedOutToday||streakDays?'populated':'empty',priority:5,markup:`<article class="card card-pad home-metric-card" data-dashboard-card="fitness" data-card-state="${workedOutToday||streakDays?'populated':'empty'}"><div class="section-head home-card-header"><div class="home-card-heading"><h2 class="section-title">运动连续打卡</h2><p class="section-note">稳定积累比一次满分更重要</p></div><span class="nav-icon home-card-symbol" style="--icon:#ff9500">动</span></div><div class="home-card-body"><div class="metric-value home-card-primary" style="color:var(--orange)">${streakDays} <small style="font-size:13px;color:var(--muted)">天</small></div><div class="metric-note home-card-detail">${workedOutToday?'今天已完成打卡':'今天还可以动一动'}</div></div><div class="home-card-actions"><button class="btn small secondary" type="button" data-module="fitness"><span class="home-action-full">去运动打卡</span><span class="home-action-short">打卡</span></button></div></article>`},
      {key:'words',state:dueWords?'attention':'empty',priority:1,markup:`<article class="card card-pad home-metric-card" data-dashboard-card="words" data-card-state="${dueWords?'attention':'empty'}"><div class="section-head home-card-header"><div class="home-card-heading"><h2 class="section-title">待复习单词</h2><p class="section-note">按照间隔重复计划复习</p></div><span class="nav-icon home-card-symbol" style="--icon:#5856d6">词</span></div><div class="home-card-body"><div class="metric-value home-card-primary">${dueWords} <small style="font-size:13px;color:var(--muted)">个</small></div><div class="metric-note home-card-detail">${dueWords?'翻转卡片即可完成一次复习':'今天的复习已清空'}</div></div><div class="home-card-actions"><button class="btn small secondary" type="button" data-module="english"><span class="home-action-full">开始复习</span><span class="home-action-short">开始</span></button></div></article>`}
    ].sort((a,b)=>stateRank[a.state]-stateRank[b.state]||a.priority-b.priority);
    return `<section class="page color-plan">

  function habitStreak(habit){
    const days=new Set(habit.dates||[]);let cursor=days.has(dateKey())?dateKey():shiftDay(dateKey(),-1),count=0;

  function renderHabits(){

    return `<div class="stack"><div class="card card-pad"><div class="trip-header"><div><h2 class="trip-destination">${esc(trip.destination)}</h2><p class="section-note">${formatFullDate(trip.startDate)} 至 ${formatFullDate(trip.endDate)} · ${status}</p></div><button class="btn danger small" data-action="delete-trip" data-id="${trip.id}">删除旅行</button></div></div>
      <div class="trip-layout">
        <div class="card card-pad"><div class="section-head"><div><h2 class="section-title">行程安排</h2><p class="section-note">按日期和时间自动排序。</p></div></div>
          <form class="quick-form" data-form="itinerary" data-id="${trip.id}"><div class="form-row"><div class="field span-3"><label>日期</label><input class="input" name="date" type="date" min="${trip.startDate}" max="${trip.endDate}" value="${trip.startDate}" required></div><div class="field span-2"><label>时间</label><input class="input" name="time" type="time" value="09:00"></div><div class="field span-5 mobile-wide"><label>安排</label><input class="input" name="title" maxlength="200" required placeholder="参观博物馆"></div><button class="btn span-2" type="submit">添加</button></div></form>
          <div class="timeline">${itinerary.length?itinerary.map(x=>`<div class="timeline-item ${x.done?'done':''}"><div class="timeline-time">${formatDate(x.date)}<br>${esc(x.time||'待定')}</div><div class="timeline-node"></div><div class="row-title">${esc(x.title)}</div><div class="row-actions"><input class="check" type="checkbox" ${x.done?'checked':''} data-action="toggle-itinerary" data-trip-id="${trip.id}" data-id="${x.id}" aria-label="标记行程完成"><button class="icon-btn" data-action="delete-itinerary" data-trip-id="${trip.id}" data-id="${x.id}" aria-label="删除行程">×</button></div></div>`).join(''):emptyState('⌁','还没有行程','先添加一个最期待的地点。')}</div>
        </div>
        <aside class="card card-pad"><div class="section-head"><div><h2 class="section-title">打包清单</h2><p class="section-note">${trip.packing.length?`${packed}/${trip.packing.length} 已完成，进度 ${packingRate}%`:'把容易忘的东西先写下来。'}</p></div></div>
          ${trip.packing.length?`<div class="progress"><span style="width:${packingRate}%;background:var(--cyan)"></span></div>`:''}
          <form class="inline-form" data-form="packing" data-id="${trip.id}"><input class="input" name="text" maxlength="200" required placeholder="护照、充电器……"><button class="btn small" type="submit">添加</button></form>
          <div class="packing-list">${trip.packing.map(x=>`<div class="packing-item ${x.done?'completed':''}"><input class="check" type="checkbox" ${x.done?'checked':''} data-action="toggle-packing" data-trip-id="${trip.id}" data-id="${x.id}" aria-label="切换打包状态"><div class="row-title" style="flex:1">${esc(x.text)}</div><button class="icon-btn" data-action="delete-packing" data-trip-id="${trip.id}" data-id="${x.id}" aria-label="删除清单项">×</button></div>`).join('')}</div>
        </aside>
      </div>
    </div>`;
  }

  function render(){
    destroyCharts();
    if(!MODULES.some(x=>x.id===activeModule)) activeModule='home';
    document.getElementById('nav').innerHTML=MODULES.map(m=>`<button class="nav-btn ${m.id===activeModule?'active':''}" data-module="${m.id}" title="${m.label}" aria-current="${m.id===activeModule?'page':'false'}"><span class="nav-icon" style="--icon:${m.color}">${m.short}</span><span class="nav-label">${m.label}</span></button>`).join('');
    const current=MODULES.find(x=>x.id===activeModule);
    document.body.dataset.activeModule=activeModule;
    syncMobileTabbar();
    const mobileDay=parseDay(dateKey()),mobileWeekday=['周日','周一','周二','周三','周四','周五','周六'][mobileDay.getDay()];
    document.getElementById('mobileTitle').textContent=`${mobileDay.getMonth()+1}月${mobileDay.getDate()}日 ${mobileWeekday} · ${current.label}`;
    document.title=`${current.label} | 人生管理系统`;
    const views={home:renderHome,goals:renderGoals,daily:renderDaily,ledger:renderLedger,fitness:renderFitness,mood:renderMood,reading:renderReading,travel:renderTravel,english:renderEnglish};
    const view=views[activeModule]||renderHome;

    if(chartFrame) cancelAnimationFrame(chartFrame);
    chartFrame=requestAnimationFrame(()=>{chartFrame=0;initActiveCharts();});

  function initActiveCharts(){
    if(activeModule==='ledger') drawLedgerChart();
    if(activeModule==='mood') drawMoodChart();
    if(activeModule==='english') drawEnglishChart();
  }

  const chartPalette=['#ff9500','#5ac8fa','#ff375f','#af52de','#34c759','#5856d6','#0071e3','#ffcc00','#64d2ff','#bf5af2','#30d158','#8e8e93'];

  function releaseCanvas(canvas,key){
    const known=chartInstances.get(key);if(known){try{known.destroy();}catch(_){}chartInstances.delete(key);}
    if(window.Chart?.getChart){const attached=Chart.getChart(canvas);if(attached){try{attached.destroy();}catch(_){}}}
  }

  function setupCanvas(canvas){
    const rect=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(rect.width*ratio)); canvas.height=Math.max(1,Math.floor(rect.height*ratio));
    const ctx=canvas.getContext('2d'); ctx.setTransform(ratio,0,0,ratio,0,0); return {ctx,w:rect.width,h:rect.height};
  }

  function drawLedgerChart(){
    const canvas=document.getElementById('ledgerChart'); if(!canvas) return;
    releaseCanvas(canvas,'ledger');
    const month=dateKey().slice(0,7), totals={};
    state.ledger.entries.filter(x=>x.type==='expense'&&x.date.startsWith(month)).forEach(x=>totals[x.category]=(totals[x.category]||0)+x.amount);
    const labels=Object.keys(totals).sort((a,b)=>totals[b]-totals[a]), values=labels.map(x=>totals[x]), total=values.reduce((a,b)=>a+b,0);
    const legend=document.getElementById('ledgerLegend');
    legend.innerHTML=labels.slice(0,7).map((x,i)=>`<div class="legend-row"><span class="legend-swatch" style="background:${chartPalette[i]}"></span><span>${esc(x)}</span><strong>${total?Math.round(totals[x]/total*100):0}%</strong></div>`).join('');
    if(!values.length){ clearCanvas(canvas); return; }
    if(window.Chart){
      const chart=new Chart(canvas,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:chartPalette.slice(0,labels.length),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${money(c.raw)}`}}},animation:{duration:500}}}); chartInstances.set('ledger',chart);
    } else drawDonutFallback(canvas,values,labels);
  }

  function drawMoodChart(){
    const canvas=document.getElementById('moodChart'); if(!canvas) return;
    releaseCanvas(canvas,'mood');
    const dates=moodRange==='month'?monthDates():weekDates(),labels=moodRange==='month'?dates.map(x=>String(parseDay(x).getDate())):WEEK_NAMES,data=dates.map(d=>{const xs=state.mood.entries.filter(x=>x.date===d);return xs.length?Number((xs.reduce((s,x)=>s+x.score,0)/xs.length).toFixed(2)):null;});
    if(window.Chart){
      const chart=new Chart(canvas,{type:'line',data:{labels,datasets:[{data,borderColor:'#ff375f',backgroundColor:'rgba(255,55,95,.09)',fill:true,tension:.35,pointRadius:moodRange==='month'?2.5:4,pointHoverRadius:6,pointBackgroundColor:'#ff375f',spanGaps:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>moodRange==='month'?`${parseDay(dates[items[0].dataIndex]).getMonth()+1}月${labels[items[0].dataIndex]}日`:items[0].label,label:c=>`${MOODS.find(m=>m.score===Math.round(c.raw))?.emoji||''} ${c.raw} 分`}}},scales:{y:{min:1,max:6,ticks:{stepSize:1,callback:v=>MOODS.find(m=>m.score===v)?.emoji||v},grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false},ticks:{maxTicksLimit:moodRange==='month'?8:7}}}}}); chartInstances.set('mood',chart);
    } else drawLineFallback(canvas,data,1,6,'#ff375f',labels);
  }

  function drawEnglishChart(){
    const canvas=document.getElementById('englishChart'); if(!canvas) return;
    releaseCanvas(canvas,'english');
    const dates=weekDates(), data=dates.map(d=>new Set(state.english.studyLogs.filter(x=>x.date===d).map(x=>x.wordId)).size);
    if(window.Chart){
      const chart=new Chart(canvas,{type:'bar',data:{labels:WEEK_NAMES,datasets:[{data,backgroundColor:'#5856d6',borderRadius:8,borderSkipped:false,maxBarThickness:36}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false}}}}}); chartInstances.set('english',chart);
    } else drawBarFallback(canvas,data,'#5856d6');
  }

  function clearCanvas(canvas){ const {ctx,w,h}=setupCanvas(canvas);ctx.clearRect(0,0,w,h); }
  function drawDonutFallback(canvas,values,labels){
    const {ctx,w,h}=setupCanvas(canvas),cx=w/2,cy=h/2,r=Math.min(w,h)*.34,total=values.reduce((a,b)=>a+b,0); let start=-Math.PI/2;

    ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;data.forEach((v,i)=>{if(v==null){drawing=false;return;}const x=p.l+cw*i/divisor,y=p.t+ch*(max-v)/(max-min);if(!drawing){ctx.beginPath();ctx.moveTo(x,y);drawing=true;}else ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,data.length>10?2.5:4,0,Math.PI*2);ctx.fill();});

  let todoSheetLastFocus=null,swipeGesture=null,suppressTodoClickUntil=0,smartNavRestoreTimer=0,smartNavTouchY=null,smartNavTouchDelta=0,smartNavPendingY=null,smartNavFrame=0,smartLastFocus=null;

  function setBackgroundInert(inert){

  function syncSidebarAccessibility(){
    const sidebar=document.getElementById('sidebar'),mobile=window.matchMedia('(max-width: 767px)').matches,open=sidebar.classList.contains('open');
    if(mobile){sidebar.inert=!open;sidebar.setAttribute('aria-hidden',String(!open));}

  function trapDialogFocus(container,event){
    if(event.key!=='Tab'||container.hidden)return;
    const focusable=[...container.querySelectorAll('button,input,select,textarea,[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&!el.hidden);
    if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }

  function updateTodoSheetViewport(){

  function settleTodoSwipe(row,target){
    const content=row.querySelector('.todo-swipe-content');

  document.addEventListener('touchstart',event=>{
    if(!window.matchMedia('(max-width: 767px)').matches)return;
    const row=event.target.closest('[data-todo-swipe]');
    if(!row||event.target.closest('button,input,select,textarea,a'))return;
    const touch=event.touches[0];closeTodoSwipes(row);
    swipeGesture={row,content:row.querySelector('.todo-swipe-content'),startX:touch.clientX,startY:touch.clientY,baseX:row.classList.contains('is-actions-open')?-144:0,horizontal:null,moved:false};
  },{passive:true});

  document.addEventListener('touchmove',event=>{
    if(!swipeGesture)return;
    const touch=event.touches[0],dx=touch.clientX-swipeGesture.startX,dy=touch.clientY-swipeGesture.startY,absX=Math.abs(dx),absY=Math.abs(dy);
    if(swipeGesture.horizontal===null&&Math.max(absX,absY)>8)swipeGesture.horizontal=absX>absY;
    if(swipeGesture.horizontal===false){swipeGesture=null;return;}
    if(!swipeGesture.horizontal)return;
    event.preventDefault();swipeGesture.moved=absX>10;
    const x=Math.max(-144,Math.min(100,swipeGesture.baseX+dx));
    swipeGesture.row.classList.add('is-swiping');swipeGesture.content.style.transform=`translateX(${x}px)`;
  },{passive:false});

  function finishTodoSwipe(cancelled=false){
    if(!swipeGesture)return;
    const gesture=swipeGesture;swipeGesture=null;
    const inlineTransform=gesture.content.style.transform.match(/translateX\((-?[\d.]+)px\)/),x=inlineTransform?Number(inlineTransform[1]):gesture.baseX;
    if(gesture.moved)suppressTodoClickUntil=Date.now()+350;
    if(!cancelled&&gesture.baseX===0&&x>=72){
      const itemId=gesture.row.dataset.id,todo=state.daily.todos.find(item=>item.id===itemId);
      if(todo&&!todo.done){haptic([12,24,18]);return mutate(s=>{const item=s.daily.todos.find(x=>x.id===itemId);if(item){item.done=true;item.completedAt=nowIso();}},{message:'已右滑完成一项计划。'});}
    }
    if(!cancelled&&(x<=-58||(gesture.baseX<0&&x<-72)))return settleTodoSwipe(gesture.row,-144);
    settleTodoSwipe(gesture.row,0);
  }

  function addTodo(form){

  }
  function addGoal(form){
    const fd=new FormData(form),title=String(fd.get('title')||'').trim(),deadline=String(fd.get('deadline'));
    let progress=clamp(Math.round(Number(fd.get('progress'))||0),0,100),status=String(fd.get('status'));

    if(!Object.hasOwn(GOAL_STATUSES,status)) status='active';
    if(status==='completed'||progress===100){status='completed';progress=100;}
    const level=Object.hasOwn(GOAL_LEVELS,fd.get('level'))?fd.get('level'):'long';
    const parentId=state.goals.items.some(x=>x.id===fd.get('parentId'))?String(fd.get('parentId')):null;
    mutate(s=>s.goals.items.push({id:id(),title,level,parentId,deadline,progress,status,createdAt:nowIso(),updatedAt:nowIso()}),{message:'目标已添加。'});
  }

  }

  function openAnalysis(){
    const report=weeklyAnalysis();lastFocus=document.activeElement;document.getElementById('modalTitle').textContent='周度数据分析';document.getElementById('modalSubtitle').textContent=report.subtitle;document.getElementById('modalBody').innerHTML=report.html;document.getElementById('overlay').hidden=false;document.getElementById('modal').hidden=false;document.body.classList.add('modal-open');setBackgroundInert(true);document.getElementById('modal').inert=false;setTimeout(()=>document.getElementById('modalClose').focus(),30);
  }
  function closeModal(){document.getElementById('overlay').hidden=true;document.getElementById('modal').hidden=true;document.body.classList.remove('modal-open');setBackgroundInert(false);syncSidebarAccessibility();if(lastFocus?.focus)lastFocus.focus();}
  function openSidebar(){const btn=document.getElementById('menuBtn'),sidebar=document.getElementById('sidebar');sidebar.classList.add('open');sidebar.inert=false;sidebar.setAttribute('aria-hidden','false');document.getElementById('mobileOverlay').hidden=false;btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-label','关闭导航');btn.textContent='×';document.getElementById('mobileMoreBtn').setAttribute('aria-expanded','true');document.body.classList.add('drawer-open');}
  function closeSidebar(){const btn=document.getElementById('menuBtn');document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').hidden=true;btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','打开导航');btn.textContent='☰';document.getElementById('mobileMoreBtn').setAttribute('aria-expanded','false');document.body.classList.remove('drawer-open');syncSidebarAccessibility();}
  function toggleSidebar(){document.getElementById('sidebar').classList.contains('open')?closeSidebar():openSidebar();}

  document.getElementById('analysisBtn').addEventListener('click',openAnalysis);
  document.getElementById('quickActionBtn').addEventListener('click',()=>toggleSmart(true));
  document.getElementById('exportBtn').addEventListener('click',exportData);
  document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change',e=>importData(e.target.files[0]));
  document.getElementById('modalClose').addEventListener('click',closeModal);
  document.getElementById('overlay').addEventListener('click',closeModal);
  document.getElementById('smartFab').addEventListener('click',()=>toggleSmart());
  document.getElementById('mobileSmartBtn').addEventListener('click',()=>toggleSmart());
  document.getElementById('smartClose').addEventListener('click',()=>toggleSmart(false));
  document.getElementById('smartSubmit').addEventListener('click',submitSmart);
  document.getElementById('smartInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitSmart();}});
  document.querySelectorAll('[data-example]').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('smartInput').value=btn.dataset.example;document.getElementById('smartInput').focus();}));
  document.getElementById('menuBtn').addEventListener('click',toggleSidebar);
  document.getElementById('mobileMoreBtn').addEventListener('click',openSidebar);
  document.getElementById('mobileOverlay').addEventListener('click',closeSidebar);
  document.getElementById('todoSheetClose').addEventListener('click',()=>closeTodoSheet());
  document.getElementById('todoSheetOverlay').addEventListener('click',()=>closeTodoSheet());
  document.addEventListener('touchstart',handleSmartNavTouchStart,{passive:true});
  document.addEventListener('touchmove',handleSmartNavTouchMove,{passive:true});
  document.addEventListener('touchend',handleSmartNavTouchEnd,{passive:true});
  document.addEventListener('touchcancel',handleSmartNavTouchEnd,{passive:true});
  document.addEventListener('scrollend',restoreSmartNav,{passive:true});
  window.visualViewport?.addEventListener('resize',updateTodoSheetViewport,{passive:true});
  window.visualViewport?.addEventListener('scroll',updateTodoSheetViewport,{passive:true});
  window.addEventListener('resize',()=>{syncSidebarAccessibility();if(!window.Chart){clearTimeout(window.__lifeResize);window.__lifeResize=setTimeout(initActiveCharts,160);}});

  const now=new Date();
  document.getElementById('sidebarDate').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()]}`;
  syncSidebarAccessibility();
  render();
  </script>
</body>
</html>
